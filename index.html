// 2. DATE, CURRENCY & EXPORT UTILITIES (Asia/Dhaka + BDT Formatting)
// ============================================================================
const STORAGE_KEY = 'dana_vet_bd_system_v1';
const AUTH_KEY = 'dana_vet_bd_admin_session_v1';

const formatBDT = (amount) => {
  const num = Number(amount || 0);
  return '৳' + num.toLocaleString('en-IN');
};

const getDhakaDateStr = (daysOffset = 0) => {
  const d = new Date();
  d.setDate(d.getDate() + daysOffset);
  return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Dhaka' }); // YYYY-MM-DD
};

const formatDisplayDate = (isoOrDateStr, lang = 'bn') => {
  if (!isoOrDateStr) return '';
  const d = new Date(isoOrDateStr);
  if (isNaN(d.getTime())) return isoOrDateStr;
  return d.toLocaleDateString(lang === 'bn' ? 'bn-BD' : 'en-GB', {
    timeZone: 'Asia/Dhaka',
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
};

const exportToCSV = (filename, headers, rows) => {
  const escapeCSV = (val) => {
    const str = String(val ?? '');
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return `"${str.replace(/"/g, '""')}"`;
    }
    return str;
  };
  const csvContent = '\uFEFF' + [
    headers.map(escapeCSV).join(','),
    ...rows.map(r => r.map(escapeCSV).join(','))
  ].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
};

  if (!user) return false;
  const roleDef = ROLES[user.role];
  if (!roleDef) return false;
  if (roleDef.permissions.includes('all')) return true;
  return roleDef.permissions.includes(perm);
};

const SalesAnalyticsChart = ({ data, lang, t }) => {
  const [hoverIdx, setHoverIdx] = useState(null);

  if (!data || data.length === 0) {
    return (
      <div className="h-64 flex items-center justify-center text-slate-400 text-sm">
        {lang === 'bn' ? 'কোনো বিক্রয় তথ্য পাওয়া যায়নি' : 'No sales data available for this range'}
      </div>
    );
  }

  const width = 760;
  const height = 250;
  const padLeft = 58;
  const padRight = 24;
  const padTop = 24;
  const padBottom = 38;
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;

  const maxRev = Math.max(...data.map(d => d.revenue), 2000);
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(maxRev * f));

  const points = data.map((d, i) => {
    const x = data.length === 1 ? padLeft + plotW / 2 : padLeft + (i / (data.length - 1)) * plotW;
    const y = padTop + plotH - (d.revenue / maxRev) * plotH;
    return { ...d, x, y, idx: i };
  });

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} L ${points[0].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} Z`;

  const hovered = hoverIdx !== null ? points[hoverIdx] : null;

  return (
    <div className="relative w-full select-none">
      <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
        <defs>
          <linearGradient id="danaEmeraldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#047857" stopOpacity="0.32" />
            <stop offset="100%" stopColor="#047857" stopOpacity="0.01" />
          </linearGradient>
        </defs>

        {/* Horizontal Grid Lines & Y-Axis Labels */}
        {yTicks.map((val, idx) => {
          const y = padTop + plotH - (val / maxRev) * plotH;
          return (
            <g key={idx}>
              <line x1={padLeft} y1={y} x2={width - padRight} y2={y} stroke="currentColor" className="text-slate-200 dark:text-slate-800" strokeDasharray="4 4" />
              <text x={padLeft - 8} y={y + 4} textAnchor="end" className="fill-slate-400 text-[11px] font-medium">
                ৳{val >= 1000 ? `${(val / 1000).toFixed(1)}k` : val}
              </text>
            </g>
          );
        })}

        {/* Area Fill & Line Stroke */}
        <path d={areaPath} fill="url(#danaEmeraldGrad)" />
        <path d={linePath} fill="none" stroke="#047857" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />

        {/* X-Axis Labels */}
        {points.map((p, i) => {
          const showLabel = data.length <= 10 || i % Math.ceil(data.length / 8) === 0 || i === data.length - 1;
          return showLabel ? (
            <text key={i} x={p.x} y={height - 10} textAnchor="middle" className="fill-slate-500 dark:fill-slate-400 text-[11px] font-medium">
              {p.label}
            </text>
          ) : null;
        })}

        {/* Hover Guide Line */}
        {hovered && (
          <line x1={hovered.x} y1={padTop} x2={hovered.x} y2={padTop + plotH} stroke="#047857" strokeWidth="1.5" strokeDasharray="3 3" />
        )}

        {/* Interactive Data Nodes & Invisible Hit Areas */}
        {points.map((p) => (
          <g key={p.idx} className="cursor-pointer"
             onMouseEnter={() => setHoverIdx(p.idx)}
             onMouseLeave={() => setHoverIdx(null)}
             onClick={() => setHoverIdx(p.idx)}>
            <circle cx={p.x} cy={p.y} r={hoverIdx === p.idx ? 6.5 : 4}
              className="fill-emerald-700 stroke-white dark:stroke-slate-900 transition-all" strokeWidth="2.5" />
            <rect x={p.x - Math.max(18, plotW / (data.length * 2))} y={padTop}
              width={Math.max(36, plotW / data.length)} height={plotH + 20} fill="transparent" />
          </g>
        ))}
      </svg>

      {/* Floating Tooltip */}
      {hovered && (
        <div
          style={{
            left: `${Math.min(82, Math.max(8, (hovered.x / width) * 100))}%`,
            top: '8px'
          }}
          className="absolute -translate-x-1/2 pointer-events-none z-20 bg-slate-900 dark:bg-slate-800 text-white px-3.5 py-2 rounded-xl shadow-xl border border-slate-700 text-xs whitespace-nowrap"
        >
          <div className="font-bold text-emerald-400 mb-0.5">{hovered.fullLabel || hovered.label}</div>
          <div className="flex items-center justify-between gap-4">
            <span className="text-slate-300">{lang === 'bn' ? 'আয়:' : 'Revenue:'}</span>
            <span className="font-extrabold text-white">{formatBDT(hovered.revenue)}</span>
          </div>
          <div className="flex items-center justify-between gap-4">
            <span className="text-slate-300">{lang === 'bn' ? 'অর্ডার সংখ্যা:' : 'Orders:'}</span>
            <span className="font-bold text-amber-300">{hovered.orders}</span>
          </div>
        </div>
      )}
    </div>
  );
};

const LiveStorefrontView = ({ state, onPlaceStorefrontOrder, onBackToAdmin, lang, setLang }) => {
  const [activeTab, setActiveTab] = useState('shop');
  const [searchQuery, setSearchQuery] = useState('');
  const [selectedCat, setSelectedCat] = useState('ALL');
  const [cart, setCart] = useState([]);
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [couponInput, setCouponInput] = useState('');
  const [appliedCoupon, setAppliedCoupon] = useState(null);
  const [deliveryArea, setDeliveryArea] = useState('inside');
  const [paymentMethod, setPaymentMethod] = useState('cod');
  const [trxId, setTrxId] = useState('');
  const [customerInfo, setCustomerInfo] = useState({ name: '', phone: '', address: '', notes: '' });
  const [placedOrderId, setPlacedOrderId] = useState(null);
  const [trackIdInput, setTrackIdInput] = useState('');
  const [trackedOrder, setTrackedOrder] = useState(null);
  const [bannerMsg, setBannerMsg] = useState(null);

  const activeProducts = useMemo(() => {
    return state.products.filter(p => {
      if (p.status !== 'active') return false;
      if (selectedCat !== 'ALL' && p.categoryId !== selectedCat) return false;
      const q = searchQuery.toLowerCase();
      return (
        p.name_bn.toLowerCase().includes(q) ||
        p.name_en.toLowerCase().includes(q) ||
        p.category_bn.toLowerCase().includes(q) ||
        p.category_en.toLowerCase().includes(q)
      );
    });
  }, [state.products, searchQuery, selectedCat]);

  const addToCart = (product) => {
    if (product.stock <= 0) {
      setBannerMsg({ type: 'error', text: lang === 'bn' ? 'দুঃখিত, এই পণ্যটি বর্তমানে স্টকে নেই!' : 'Sorry, this product is currently out of stock!' });
      return;
    }
    setCart(prev => {
      const existing = prev.find(i => i.id === product.id);
      if (existing) {
        if (existing.qty >= product.stock) {
          setBannerMsg({ type: 'error', text: lang === 'bn' ? `সর্বোচ্চ ${product.stock}টি স্টকে আছে` : `Only ${product.stock} available in stock` });
          return prev;
        }
        return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
      }
      return [...prev, { ...product, qty: 1 }];
    });
  };

  const updateCartQty = (id, delta) => {
    setCart(prev => prev.map(item => {
      if (item.id !== id) return item;
      const prod = state.products.find(p => p.id === id);
      const maxStock = prod ? prod.stock : 99;
      const nextQty = Math.min(maxStock, item.qty + delta);
      return nextQty > 0 ? { ...item, qty: nextQty } : null;
    }).filter(Boolean));
  };

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const deliveryFee = cart.length > 0 ? (deliveryArea === 'inside' ? Number(state.cms.insideDhakaFee || 80) : Number(state.cms.outsideDhakaFee || 150)) : 0;

  let discountAmount = 0;
  if (appliedCoupon && subtotal >= appliedCoupon.minOrder) {
    if (appliedCoupon.type === 'percentage') {
      discountAmount = Math.min(appliedCoupon.maxDiscount || 999999, Math.round((subtotal * appliedCoupon.value) / 100));
    } else {
      discountAmount = Math.min(appliedCoupon.value, subtotal);
    }
  }
  const grandTotal = Math.max(0, subtotal + deliveryFee - discountAmount);

  const handleApplyCoupon = (e) => {
    e.preventDefault();
    const code = couponInput.trim().toUpperCase();
    const found = state.coupons.find(c => c.code.toUpperCase() === code && c.status === 'active');
    if (!found) {
      setBannerMsg({ type: 'error', text: lang === 'bn' ? 'অকার্যকর বা মেয়াদোত্তীর্ণ কুপন কোড' : 'Invalid or expired coupon code' });
      return;
    }
    if (subtotal < found.minOrder) {
      setBannerMsg({ type: 'error', text: lang === 'bn' ? `ন্যূনতম ৳${found.minOrder} অর্ডার প্রয়োজন` : `Minimum order ৳${found.minOrder} required` });
      return;
    }
    setAppliedCoupon(found);
    setBannerMsg({ type: 'success', text: lang === 'bn' ? `কুপন ${found.code} প্রয়োগ করা হয়েছে!` : `Coupon ${found.code} applied!` });
  };

  const handleCheckout = (e) => {
    e.preventDefault();
    if (cart.length === 0) return;
    if (!customerInfo.name.trim() || !customerInfo.phone.trim() || !customerInfo.address.trim()) {
      setBannerMsg({ type: 'error', text: lang === 'bn' ? 'অনুগ্রহ করে নাম, মোবাইল ও ঠিকানা দিন' : 'Please fill all customer fields' });
      return;
    }
    if ((paymentMethod === 'bkash' || paymentMethod === 'nagad') && !trxId.trim()) {
      setBannerMsg({ type: 'error', text: lang === 'bn' ? 'অনুগ্রহ করে TrxID দিন' : 'Please provide Transaction ID (TrxID)' });
      return;
    }

    const createdOrder = onPlaceStorefrontOrder({
      customerName: customerInfo.name.trim(),
      phone: customerInfo.phone.trim(),
      address: customerInfo.address.trim(),
      notes: customerInfo.notes.trim(),
      deliveryArea: deliveryArea === 'inside' ? 'Inside Dhaka' : 'Outside Dhaka',

        name_en: c.name_en,
        qty: c.qty,
        price: c.price,
        costPrice: c.costPrice || 0
      })),
      subtotal,
      deliveryFee,
      discount: discountAmount,
      couponCode: appliedCoupon ? appliedCoupon.code : '',
      total: grandTotal,
      paymentMethod: paymentMethod === 'cod' ? 'COD' : paymentMethod === 'bkash' ? 'bKash' : 'Nagad',
      trxId: paymentMethod === 'cod' ? 'N/A' : trxId.trim()
    });

    setPlacedOrderId(createdOrder.id);
    setTrackIdInput(createdOrder.id);
    setCart([]);
    setAppliedCoupon(null);
    setCouponInput('');
    setTrxId('');
    setCustomerInfo({ name: '', phone: '', address: '', notes: '' });
    setIsCartOpen(false);
  };

  const handleTrack = (e) => {
    e.preventDefault();
    const found = state.orders.find(o => o.id.toUpperCase() === trackIdInput.trim().toUpperCase());
    setTrackedOrder(found || 'NOT_FOUND');
  };

  return (

          </span>
          <span className="hidden sm:inline text-slate-300">
            — {lang === 'bn' ? 'এখানে অর্ডার করলে সরাসরি অ্যাডমিন ড্যাশবোর্ডে যুক্ত হবে!' : 'Orders placed here sync immediately to the Admin Dashboard!'}
          </span>
        </div>
        <button
          onClick={onBackToAdmin}
          className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1 rounded-lg transition flex items-center gap-1.5 shadow"
        >
          <Icons.Dashboard size={14} />
          {lang === 'bn' ? 'অ্যাডমিন ড্যাশবোর্ডে ফিরুন' : 'Return to Admin Dashboard'}
        </button>
      </div>

      {/* Storefront Header */}
      <header className="sticky top-0 z-30 bg-emerald-800 text-white shadow-md">
        <div className="bg-emerald-950 text-xs py-1.5 px-4 text-emerald-100 flex justify-between items-center">
          <span className="flex items-center gap-1.5">
            <Icons.PhoneCall size={14} className="text-emerald-400" />
            {state.cms.hotline} (সকাল ৯টা - রাত ৮টা)
          </span>
          <div className="flex items-center gap-2">
            <button onClick={() => setLang('bn')} className={`px-2 py-0.5 rounded text-xs font-bold ${lang === 'bn' ? 'bg-emerald-600 text-white' : 'text-emerald-200'}`}>বাংলা</button>

          </div>

                  <td className="py-2.5 px-3">{idx + 1}</td>
                  <td className="py-2.5 px-3 font-semibold">{item.name_bn} <span className="text-slate-500">({item.name_en})</span></td>
                  <td className="py-2.5 px-3 text-center">{item.qty}</td>
                  <td className="py-2.5 px-3 text-right">{formatBDT(item.price)}</td>
                  <td className="py-2.5 px-3 text-right font-bold">{formatBDT(item.price * item.qty)}</td>
                </tr>
              ))}
            </tbody>
          </table>

          <div className="flex justify-end">
            <div className="w-64 space-y-1.5 text-xs">
              <div className="flex justify-between"><span>Subtotal:</span><span>{formatBDT(order.subtotal)}</span></div>
              <div className="flex justify-between"><span>Delivery Charge ({order.deliveryArea}):</span><span>{formatBDT(order.deliveryFee)}</span></div>
              {order.discount > 0 && (
                <div className="flex justify-between text-emerald-700 font-bold">
                  <span>Discount {order.couponCode ? `(${order.couponCode})` : ''}:</span>
                  <span>-{formatBDT(order.discount)}</span>
                </div>
              )}
              <div className="flex justify-between text-base font-extrabold border-t border-slate-300 pt-2">
                <span>Grand Total:</span>
                <span className="text-emerald-800">{formatBDT(order.total)}</span>
              </div>
            </div>
          </div>

          <div className="text-center text-[11px] text-slate-500 border-t border-slate-200 pt-4">
            ধন্যবাদ ডানা ভেট বিডি-র সাথে থাকার জন্য! • Thank you for trusting Dana Vet BD.
          </div>
        </div>
      </div>
    </div>
  );
};

// ============================================================================
// 10. MAIN APPLICATION SHELL (Admin Dashboard + All 15 Functional Modules)
// ============================================================================
function App() {
  // Load persistent system state
  const [sys, setSys] = useState(() => {
    const seed = createInitialSystemState();
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return seed;
      const parsed = JSON.parse(saved);
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.products) || !Array.isArray(parsed.orders) || !Array.isArray(parsed.customers)) return seed;
      return { ...seed, ...parsed, stockMovements: Array.isArray(parsed.stockMovements) ? parsed.stockMovements : seed.stockMovements, notifications: Array.isArray(parsed.notifications) ? parsed.notifications : seed.notifications, products: parsed.products.map(p => ({ ...p, batchNumber: p.batchNumber || '', expiryDate: p.expiryDate || '' })) };
    } catch (e) { try { localStorage.removeItem(STORAGE_KEY); } catch (_) {} return seed; }
  });

  // Load admin session
  // Demo app deliberately requires a fresh sign-in on every page load.
  const [currentUser, setCurrentUser] = useState(null);
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}

  const [viewMode, setViewMode] = useState('admin'); // 'admin' | 'storefront'
  const [activePage, setActivePage] = useState('dashboard');
  const [lang, setLang] = useState('bn');
  const [darkMode, setDarkMode] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toast, setToast] = useState(null);

  // Global Header Search & Menus
  const [globalQuery, setGlobalQuery] = useState('');
  const [showGlobalResults, setShowGlobalResults] = useState(false);
  const [showNotifDrop, setShowNotifDrop] = useState(false);
  const [showQuickDrop, setShowQuickDrop] = useState(false);
  const [showProfileDrop, setShowProfileDrop] = useState(false);

  // Shared Modals
  const [selectedOrderModal, setSelectedOrderModal] = useState(null);
  const [invoiceOrderModal, setInvoiceOrderModal] = useState(null);
  const [productFormModal, setProductFormModal] = useState(null); // null | { mode: 'add'|'edit', product }
  const [manualOrderModal, setManualOrderModal] = useState(false);
  const [addCustomerModal, setAddCustomerModal] = useState(false);
  const [restockModal, setRestockModal] = useState(null); // null | product
  const [selectedCustomerDrawer, setSelectedCustomerDrawer] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null); // { title, message, onConfirm }

  const t = UI[lang];

  // Sync state to localStorage
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sys));
    } catch (e) {}
  }, [sys]);

  useEffect(() => {
    if (darkMode) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [darkMode]);

  const notifyToast = (msg, type = 'success') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  const logAudit = (prevSys, action, target) => {
    const entry = {
      id: 'LOG-' + Date.now().toString().slice(-5),
      time: getDhakaDateStr(0) + ' ' + new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Dhaka', hour: '2-digit', minute: '2-digit' }),
      admin: currentUser ? currentUser.name : 'System',
      role: currentUser ? currentUser.role : 'Storefront',
      action,
      target
    };
    return [entry, ...(prevSys.auditLogs || [])].slice(0, 100);
  };

  // Auth Handlers
  const handleLogin = (userObj) => {
    setCurrentUser(userObj);
    // Demo authentication is session-only (in-memory); never persist a login across reloads.
    localStorage.removeItem(AUTH_KEY);
    setSys(prev => ({
      ...prev,
      auditLogs: logAudit({ ...prev }, 'Admin Logged In', userObj.email)
    }));
    notifyToast(lang === 'bn' ? `স্বাগতম, ${userObj.name}!` : `Welcome back, ${userObj.name}!`);
  };

  const handleLogout = () => {
    setCurrentUser(null);
    localStorage.removeItem(AUTH_KEY);
    setShowProfileDrop(false);
  };

  const handleExportDemo = () => {
    try {
      const backup = { app: 'Dana Vet BD Admin Demo', schemaVersion: 1, exportedAt: new Date().toISOString(), data: sys };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `dana-vet-demo-backup-${getDhakaDateStr(0)}.json`;
      link.click();
      URL.revokeObjectURL(url);
      notifyToast(lang === 'bn' ? 'Demo backup export হয়েছে!' : 'Demo backup exported!');
    } catch (err) {
      notifyToast(lang === 'bn' ? 'Backup export করা যায়নি।' : 'Could not export backup.', 'error');
    }
  };


  const handleImportDemo = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result || ''));
        const imported = parsed && parsed.data ? parsed.data : parsed;
        const requiredKeys = ['products', 'orders', 'customers', 'staff', 'settings', 'cms'];
        if (!imported || typeof imported !== 'object' || requiredKeys.some(k => !Array.isArray(imported[k]) && typeof imported[k] !== 'object')) {
          throw new Error('Invalid backup structure');
        }
        if (!Array.isArray(imported.products) || !Array.isArray(imported.orders) || !Array.isArray(imported.customers) || !Array.isArray(imported.staff) || !Array.isArray(imported.categories) || !Array.isArray(imported.notifications)) throw new Error('Invalid data arrays');
        if (!imported.settings || typeof imported.settings !== 'object' || !imported.cms || typeof imported.cms !== 'object') throw new Error('Missing settings or CMS data');
        if (imported.products.some(p => !p || typeof p !== 'object' || !p.id || !p.sku) || imported.orders.some(o => !o || typeof o !== 'object' || !o.id)) throw new Error('Malformed product/order records');
        setConfirmDialog({
          title: lang === 'bn' ? 'Backup restore করবেন?' : 'Restore this backup?',
          message: lang === 'bn' ? 'বর্তমান demo data import করা backup দিয়ে প্রতিস্থাপন হবে।' : 'Current demo data will be replaced by the imported backup.',
          onConfirm: () => {
            const safeData = { ...createInitialSystemState(), ...imported };
            setSys(safeData);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(safeData));
            setConfirmDialog(null);
            notifyToast(lang === 'bn' ? 'Backup restore সফল হয়েছে!' : 'Backup restored successfully!');
          }
        });
      } catch (err) {
        notifyToast(lang === 'bn' ? 'Invalid JSON backup file।' : 'Invalid JSON backup file.', 'error');
      }
    };
    reader.onerror = () => notifyToast(lang === 'bn' ? 'ফাইল পড়া যায়নি।' : 'Could not read file.', 'error');
    reader.readAsText(file);
  };


  const handleResetDemo = () => {
    setConfirmDialog({
      title: lang === 'bn' ? 'ডেমো ডাটা রিসেট করবেন?' : 'Reset All Demo Data?',
      message: lang === 'bn' ? 'সকল অর্ডার, পণ্য ও সেটিংস প্রাথমিক ডেমো অবস্থায় ফিরে যাবে।' : 'This will restore all initial 24 demo orders, 12 products, and 14 customers.',
      onConfirm: () => {
        const fresh = createInitialSystemState();
        setSys(fresh);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
        setConfirmDialog(null);
        notifyToast(lang === 'bn' ? 'ডেমো ডাটা সফলভাবে রিসেট হয়েছে!' : 'Demo data restored successfully!');
      }
    });
  };

  // ==========================================================================
  // CORE BUSINESS LOGIC: ORDER STATUS, STOCK SYNC, PAYMENT VERIFICATION
  // ==========================================================================
  const updateOrderStatus = (orderId, newStatus, reason = '') => {
    const targetOrder = sys.orders.find(o => o.id === orderId);
    if (!targetOrder) {
      notifyToast(lang === 'bn' ? 'অর্ডারটি খুঁজে পাওয়া যায়নি।' : 'Order not found.', 'error');
      return false;
    }
    if (targetOrder.orderStatus === newStatus) {
      notifyToast(lang === 'bn' ? 'অর্ডারটি ইতিমধ্যে এই স্ট্যাটাসে আছে।' : 'Order already has this status.', 'error');
      return false;
    }

    const shouldDeduct = ['Confirmed', 'Processing', 'Shipped', 'Delivered'].includes(newStatus);
    const shouldRestore = ['Cancelled', 'Returned'].includes(newStatus);
    let updatedProducts = sys.products.map(p => ({ ...p }));
    let updatedMovements = [...sys.stockMovements];
    let stockDeducted = !!targetOrder.stockDeducted;
    let paymentStatus = targetOrder.paymentStatus;

    // Validate all products before applying any stock changes (atomic demo operation).
    if (shouldDeduct && !stockDeducted) {
      for (const item of targetOrder.items || []) {
        const prod = updatedProducts.find(p => p.id === item.productId);
        if (!prod) {
          notifyToast(lang === 'bn' ? `পণ্য পাওয়া যায়নি: ${item.productName || item.productId}` : `Product not found: ${item.productName || item.productId}`, 'error');
          return false;
        }
        if (Number(prod.stock) < Number(item.qty)) {
          notifyToast(lang === 'bn' ? `অপর্যাপ্ত স্টক: ${prod.name_bn} (বর্তমান স্টক: ${prod.stock})` : `Insufficient stock for ${prod.name_en} (Available: ${prod.stock})`, 'error');
          return false;
        }
      }
      (targetOrder.items || []).forEach(item => {
        updatedProducts = updatedProducts.map(p => {
          if (p.id !== item.productId) return p;
          const newStock = p.stock - item.qty;
          updatedMovements.unshift({ id: 'STK-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), date: getDhakaDateStr(0) + ' ' + new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Dhaka', hour: '2-digit', minute: '2-digit' }), productId: p.id, productName: p.name_bn, type: 'Order Deduction', qtyChange: -item.qty, previousStock: p.stock, newStock, supplier: '-', cost: 0, reason: `Order ${orderId} → ${newStatus}`, admin: currentUser?.name || 'Admin' });
          return { ...p, stock: newStock };
        });
      });
      stockDeducted = true;
    }

    if (shouldRestore && stockDeducted) {
      (targetOrder.items || []).forEach(item => {
        updatedProducts = updatedProducts.map(p => {
          if (p.id !== item.productId) return p;
          const newStock = p.stock + item.qty;
          updatedMovements.unshift({ id: 'STK-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), date: getDhakaDateStr(0) + ' ' + new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Dhaka', hour: '2-digit', minute: '2-digit' }), productId: p.id, productName: p.name_bn, type: 'Order Restoration', qtyChange: item.qty, previousStock: p.stock, newStock, supplier: '-', cost: 0, reason: `Order ${orderId} ${newStatus}${reason ? `: ${reason}` : ''}`, admin: currentUser?.name || 'Admin' });
          return { ...p, stock: newStock };
        });
      });
      stockDeducted = false;
    }

    if (newStatus === 'Delivered' && targetOrder.paymentMethod === 'COD' && paymentStatus === 'Unpaid') paymentStatus = 'Paid';
    if (newStatus === 'Returned' && ['Paid', 'Verified'].includes(paymentStatus)) paymentStatus = 'Refunded';

    setSys(prev => ({
      ...prev,
      products: updatedProducts,
      stockMovements: updatedMovements,
      orders: prev.orders.map(o => o.id === orderId ? { ...o, orderStatus: newStatus, stockDeducted, paymentStatus, deliveryStatus: newStatus === 'Delivered' ? 'Delivered' : newStatus === 'Shipped' ? (o.deliveryStatus || 'Shipped') : o.deliveryStatus, cancelReason: reason || o.cancelReason } : o),
      auditLogs: logAudit(prev, `Order Status Updated to ${newStatus}`, orderId)
    }));
    notifyToast(lang === 'bn' ? `অর্ডার ${orderId} স্ট্যাটাস আপডেট হয়েছে (${newStatus})` : `Order ${orderId} updated to ${newStatus}`);
    return true;
  };

  const verifyOrUpdatePaymentStatus = (orderId, newPayStatus) => {
    if (!hasPermission(currentUser, 'verify_payment')) {
      notifyToast(lang === 'bn' ? 'আপনার পেমেন্ট ভেরিফাই করার অনুমতি নেই!' : 'You do not have permission to verify payments.', 'error');
      return;
    }
    setSys(prev => ({
      ...prev,
      orders: prev.orders.map(o => o.id === orderId ? { ...o, paymentStatus: newPayStatus } : o),
      auditLogs: logAudit(prev, `Payment Marked as ${newPayStatus}`, orderId)
    }));
    notifyToast(lang === 'bn' ? `পেমেন্ট স্ট্যাটাস আপডেট: ${newPayStatus}` : `Payment marked as ${newPayStatus}`);
  };

  // Storefront or Manual Order Creation (Auto-links or creates Customer + Notifications)
  const createNewOrderRecord = (payload, source = 'Storefront') => {
    const newId = 'DANA-' + Math.floor(102505 + Math.random() * 897000);
    const today = getDhakaDateStr(0);
    const nowTime = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Dhaka', hour: '2-digit', minute: '2-digit' });

    let customerId = '';
    setSys(prev => {
      let existingCust = prev.customers.find(c => c.phone.replace(/\D/g, '') === payload.phone.replace(/\D/g, ''));
      let updatedCustomers = [...prev.customers];
      if (existingCust) {
        customerId = existingCust.id;
      } else {
        customerId = 'CUST-' + String(prev.customers.length + 1).padStart(2, '0');
        updatedCustomers.unshift({
          id: customerId,
          name: payload.customerName,
          phone: payload.phone,
          area: payload.deliveryArea,
          address: payload.address,
          joinedDate: today,
          notes: source === 'Storefront' ? 'অনলাইন স্টোরফ্রন্ট থেকে স্বয়ংক্রিয়ভাবে যুক্ত' : 'ম্যানুয়ালি যুক্ত'
        });
      }

      const paymentStatus = payload.paymentMethod === 'COD' ? 'Unpaid' : 'Pending Verification';

      const newOrder = {
        id: newId,
        date: today,
        time: nowTime,
        source,
        customerId,
        customerName: payload.customerName,
        phone: payload.phone,
        deliveryArea: payload.deliveryArea,
        address: payload.address,
        notes: payload.notes || '',
        items: payload.items,
        subtotal: payload.subtotal,
        deliveryFee: payload.deliveryFee,
        discount: payload.discount || 0,
        couponCode: payload.couponCode || '',
        total: payload.total,
        paymentMethod: payload.paymentMethod,
        trxId: payload.trxId || 'N/A',
        paymentStatus,
        orderStatus: 'Pending',
        stockDeducted: false
      };

      const updatedCoupons = payload.couponCode
        ? prev.coupons.map(c => c.code.toUpperCase() === payload.couponCode.toUpperCase() ? { ...c, usedCount: (c.usedCount || 0) + 1 } : c)
        : prev.coupons;

      const newNotif = {
        id: 'NOT-' + Date.now().toString().slice(-5),
        type: 'order',
        title_bn: `নতুন অর্ডার (${newId})`,
        title_en: `New Order (${newId})`,
        desc_bn: `${payload.customerName} — ${formatBDT(payload.total)} (${payload.paymentMethod})`,
        desc_en: `${payload.customerName} — ${formatBDT(payload.total)} (${payload.paymentMethod})`,
        time: 'এইমাত্র',
        unread: true,
        link: 'orders'
      };

      return {
        ...prev,
        customers: updatedCustomers,
        orders: [newOrder, ...prev.orders],
        coupons: updatedCoupons,
        notifications: [newNotif, ...prev.notifications],
        auditLogs: logAudit(prev, `New Order Placed (${source})`, newId)
      };
    });

    return { id: newId };
  };

  // ==========================================================================
  // RENDER LOGIN IF LOGGED OUT
  // ==========================================================================
  if (!currentUser) {
    return <AdminLoginScreen staffList={sys.staff} onLogin={handleLogin} lang={lang} setLang={setLang} />;
  }

  // ==========================================================================
  // RENDER STOREFRONT PREVIEW MODE IF SWITCHED
  // ==========================================================================
  if (viewMode === 'storefront') {
    return (
      <LiveStorefrontView
        state={sys}
        lang={lang}
        setLang={setLang}
        onBackToAdmin={() => setViewMode('admin')}
        onPlaceStorefrontOrder={(data) => createNewOrderRecord(data, 'Storefront')}
      />
    );
  }

  // ==========================================================================
  // COMPUTED BADGES & GLOBAL SEARCH RESULTS
  // ==========================================================================
  const pendingOrdersCount = sys.orders.filter(o => o.orderStatus === 'Pending').length;
  const lowStockCount = sys.products.filter(p => p.stock <= p.minStock).length;
  const unverifiedPaymentsCount = sys.orders.filter(o => o.paymentStatus === 'Pending Verification').length;
  const unreadNotifCount = sys.notifications.filter(n => n.unread).length;

  const globalResults = (() => {
    const q = globalQuery.trim().toLowerCase();
    if (!q) return { orders: [], products: [], customers: [] };
    return {
      orders: sys.orders.filter(o => o.id.toLowerCase().includes(q) || o.customerName.toLowerCase().includes(q) || o.phone.includes(q)).slice(0, 4),
      products: sys.products.filter(p => p.name_bn.toLowerCase().includes(q) || p.name_en.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)).slice(0, 4),
      customers: sys.customers.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q)).slice(0, 4)
    };
  })();

  // Sidebar Menu Definition
  const menuGroups = [
    {
      title: t.grpMain,
      items: [
        { id: 'dashboard', label: t.nav_dashboard, icon: Icons.Dashboard, perm: 'dashboard' },
        { id: 'orders', label: t.nav_orders, icon: Icons.ShoppingBag, perm: 'orders', badge: pendingOrdersCount, badgeColor: 'bg-amber-500 text-slate-950' },
        { id: 'products', label: t.nav_products, icon: Icons.Package, perm: 'products' },
        { id: 'categories', label: t.nav_categories, icon: Icons.Layers, perm: 'categories' },
        { id: 'inventory', label: t.nav_inventory, icon: Icons.Warehouse, perm: 'inventory', badge: lowStockCount, badgeColor: 'bg-red-500 text-white' },
        { id: 'delivery', label: t.nav_delivery, icon: Icons.Truck, perm: 'delivery' },
        { id: 'customers', label: t.nav_customers, icon: Icons.Users, perm: 'customers' }
      ]
    },
    {
      title: t.grpBusiness,
      items: [
        { id: 'sales', label: t.nav_sales, icon: Icons.TrendingUp, perm: 'sales' },
        { id: 'payments', label: t.nav_payments, icon: Icons.CreditCard, perm: 'payments', badge: unverifiedPaymentsCount, badgeColor: 'bg-amber-500 text-slate-950' },
        { id: 'coupons', label: t.nav_coupons, icon: Icons.Tag, perm: 'coupons' },
        { id: 'reports', label: t.nav_reports, icon: Icons.BarChart, perm: 'reports' }
      ]
    },
    {
      title: t.grpWebsite,
      items: [
        { id: 'cms_content', label: t.nav_cms_content, icon: Icons.Globe, perm: 'cms' },
        { id: 'cms_doctors', label: t.nav_cms_doctors, icon: Icons.Stethoscope, perm: 'cms' },
        { id: 'cms_reviews', label: t.nav_cms_reviews, icon: Icons.Star, perm: 'cms' },
        { id: 'cms_support', label: t.nav_cms_support, icon: Icons.Headphones, perm: 'cms' }
      ]
    },
    {
      title: t.grpSystem,
      items: [
        { id: 'staff', label: t.nav_staff, icon: Icons.Shield, perm: 'all' },
        { id: 'notifications', label: t.nav_notifications, icon: Icons.Bell, perm: 'notifications', badge: unreadNotifCount, badgeColor: 'bg-emerald-500 text-white' },
        { id: 'settings', label: t.nav_settings, icon: Icons.Settings, perm: 'all' }
      ]
    }
  ];

  const currentNavTitle = menuGroups.flatMap(g => g.items).find(i => i.id === activePage)?.label || t.nav_dashboard;

  return (
    <div className="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
      {/* Mobile Sidebar Backdrop */}
      {sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 z-40 bg-slate-900/60 lg:hidden" />
      )}

      {/* ==================================================================== */}
      {/* FIXED DESKTOP SIDEBAR / MOBILE DRAWER                                */}
      {/* ==================================================================== */}
      <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-68 bg-[#123f34] dark:bg-[#123f34] border-r border-[#0e352c] flex flex-col transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
        {/* Brand Header */}
        <div className="h-16 px-4 border-b border-[#28584d] flex items-center justify-between">
          <div onClick={() => setActivePage('dashboard')} className="flex items-center gap-2.5 cursor-pointer">
            <div className="w-9 h-9 rounded-xl bg-emerald-700 text-white font-black text-lg flex items-center justify-center shadow-sm">D</div>
            <div>
              <div className="flex items-center gap-1.5">
                <span className="font-extrabold text-base text-white leading-none">{t.brand}</span>
                <span className="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300">DEMO</span>
              </div>
              <p className="text-[11px] text-emerald-100/70 mt-0.5">{t.brandSub}</p>

              const delta = adj.type === 'Stock Reduction' ? -Math.abs(adj.qty) : adj.type === 'Stock Correction' ? (adj.qty - target.stock) : Math.abs(adj.qty);

          onClose={() => setAddCustomerModal(false)}
          onSave={(cust) => {
            setSys(prev => {
              const newC = {
                id: 'CUST-' + String(prev.customers.length + 1).padStart(2, '0'),
                ...cust,
                joinedDate: getDhakaDateStr(0)
              };
              return {
                ...prev,
                customers: [newC, ...prev.customers],
                auditLogs: logAudit(prev, 'Customer Added', newC.name)
              };
            });
            setAddCustomerModal(false);
            notifyToast(lang === 'bn' ? 'নতুন গ্রাহক যুক্ত হয়েছে!' : 'Customer added!');
          }}
          lang={lang}
        />
      )}

      {selectedCustomerDrawer && (
        <CustomerProfileModal
          customer={sys.customers.find(c => c.id === selectedCustomerDrawer.id) || selectedCustomerDrawer}
          orders={sys.orders.filter(o => o.customerId === selectedCustomerDrawer.id || o.phone === selectedCustomerDrawer.phone)}
          onClose={() => setSelectedCustomerDrawer(null)}
          onSaveNotes={(notes) => {
            setSys(prev => ({
              ...prev,
              customers: prev.customers.map(c => c.id === selectedCustomerDrawer.id ? { ...c, notes } : c)
            }));
            notifyToast(lang === 'bn' ? 'গ্রাহকের নোট সংরক্ষিত হয়েছে' : 'Customer notes updated');
          }}
          lang={lang}
        />
      )}

      {/* Confirmation Dialog */}
      {confirmDialog && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
            <h4 className="font-extrabold text-base text-slate-900 dark:text-white mb-2">{confirmDialog.title}</h4>
            <p className="text-xs text-slate-600 dark:text-slate-400 mb-5">{confirmDialog.message}</p>
            <div className="flex justify-end gap-2">
              <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold">
                {t.cancel}
              </button>
              <button onClick={confirmDialog.onConfirm} className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold">
                {lang === 'bn' ? 'নিশ্চিত করুন' : 'Confirm'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toast Notification */}
      {toast && (
        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 border ${
          toast.type === 'error'
            ? 'bg-red-600 text-white border-red-500'
            : 'bg-slate-900 text-white border-emerald-500'
        }`}>
          <Icons.CheckCircle size={16} className={toast.type === 'error' ? 'text-white' : 'text-emerald-400'} />
          <span>{toast.msg}</span>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// 11. MODULE 1: DASHBOARD OVERVIEW (5-Second Executive Visibility)
// ============================================================================
const DashboardOverviewPage = ({
  sys, lang, t, onNavigate, onOpenOrder, onPrintInvoice, onUpdateStatus, onOpenRestock, onOpenAddProduct, onOpenAddCustomer
}) => {
  const [dateRange, setDateRange] = useState('today'); // 'today' | 'yesterday' | '7d' | '30d' | 'custom'
  const [customStart, setCustomStart] = useState(getDhakaDateStr(-7));
  const [customEnd, setCustomEnd] = useState(getDhakaDateStr(0));
  const [chartGranularity, setChartGranularity] = useState('daily'); // 'daily' | 'weekly' | 'monthly'

  const todayStr = getDhakaDateStr(0);
  const yesterdayStr = getDhakaDateStr(-1);
  const d7Str = getDhakaDateStr(-6);
  const d30Str = getDhakaDateStr(-29);

  // Filter orders by selected date range
  const filteredOrders = useMemo(() => {
    return sys.orders.filter(o => {
      if (dateRange === 'today') return o.date === todayStr;
      if (dateRange === 'yesterday') return o.date === yesterdayStr;
      if (dateRange === '7d') return o.date >= d7Str && o.date <= todayStr;
      if (dateRange === '30d') return o.date >= d30Str && o.date <= todayStr;
      if (dateRange === 'custom') return o.date >= customStart && o.date <= customEnd;
      return true;
    });
  }, [sys.orders, dateRange, todayStr, yesterdayStr, d7Str, d30Str, customStart, customEnd]);

  // Previous equivalent period for comparison %
  const prevPeriodOrders = useMemo(() => {
    if (dateRange === 'today') return sys.orders.filter(o => o.date === yesterdayStr);
    if (dateRange === 'yesterday') return sys.orders.filter(o => o.date === getDhakaDateStr(-2));
    const rangeStart = dateRange === 'custom' ? customStart : dateRange === '7d' ? d7Str : d30Str;
    const rangeEnd = dateRange === 'custom' ? customEnd : todayStr;
    const startDate = new Date(`${rangeStart}T00:00:00`);
    const endDate = new Date(`${rangeEnd}T00:00:00`);
    if (!Number.isFinite(startDate.getTime()) || !Number.isFinite(endDate.getTime()) || startDate > endDate) return [];
    const days = Math.round((endDate - startDate) / 86400000) + 1;
    const previousEnd = new Date(startDate.getTime() - 86400000);
    const previousStart = new Date(previousEnd.getTime() - (days - 1) * 86400000);
    const toKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const fromKey = toKey(previousStart), toKeyEnd = toKey(previousEnd);
    return sys.orders.filter(o => o.date >= fromKey && o.date <= toKeyEnd);
  }, [sys.orders, dateRange, yesterdayStr, d7Str, d30Str, todayStr, customStart, customEnd]);

  // Financial Metrics (NEVER count cancelled orders as sales)
  const validOrders = filteredOrders.filter(o => o.orderStatus !== 'Cancelled');
  const totalSales = validOrders.reduce((s, o) => s + o.total, 0);
  const paidRevenue = validOrders.filter(o => ['Paid', 'Verified'].includes(o.paymentStatus)).reduce((s, o) => s + o.total, 0);
  const pendingPaymentRev = validOrders.filter(o => ['Unpaid', 'Pending Verification'].includes(o.paymentStatus)).reduce((s, o) => s + o.total, 0);

  const prevValidSales = prevPeriodOrders.filter(o => o.orderStatus !== 'Cancelled').reduce((s, o) => s + o.total, 0);
  const salesGrowth = prevValidSales > 0 ? Math.round(((totalSales - prevValidSales) / prevValidSales) * 100) : null;
  const orderGrowth = prevPeriodOrders.length > 0 ? Math.round(((filteredOrders.length - prevPeriodOrders.length) / prevPeriodOrders.length) * 100) : null;

  // New Customers in selected range
  const newCustomersCount = sys.customers.filter(c => {
    if (dateRange === 'today') return c.joinedDate === todayStr;
    if (dateRange === 'yesterday') return c.joinedDate === yesterdayStr;
    if (dateRange === '7d') return c.joinedDate >= d7Str;
    if (dateRange === '30d') return c.joinedDate >= d30Str;
    return c.joinedDate >= customStart && c.joinedDate <= customEnd;
  }).length;

  // Global Pending Orders requiring processing
  const allPendingOrders = sys.orders.filter(o => o.orderStatus === 'Pending');
  const unverifiedOrders = sys.orders.filter(o => o.paymentStatus === 'Pending Verification');

  // Interactive Chart Series Data
  const chartData = useMemo(() => {
    if (chartGranularity === 'daily') {
      const days = [];
      for (let i = 9; i >= 0; i--) {
        const dStr = getDhakaDateStr(-i);
        const dayOrders = sys.orders.filter(o => o.date === dStr && o.orderStatus !== 'Cancelled');
        days.push({
          label: dStr.slice(5),
          fullLabel: formatDisplayDate(dStr, lang),
          revenue: dayOrders.reduce((s, o) => s + o.total, 0),
          orders: dayOrders.length
        });
      }
      return days;
    } else if (chartGranularity === 'weekly') {
      return [3, 2, 1, 0].map(w => {
        const start = getDhakaDateStr(-(w * 7 + 6));
        const end = getDhakaDateStr(-(w * 7));
        const wOrders = sys.orders.filter(o => o.date >= start && o.date <= end && o.orderStatus !== 'Cancelled');
        return {
          label: lang === 'bn' ? `সপ্তাহ ${4 - w}` : `Week ${4 - w}`,
          fullLabel: `${start.slice(5)} → ${end.slice(5)}`,
          revenue: wOrders.reduce((s, o) => s + o.total, 0),
          orders: wOrders.length
        };
      });
    } else {
      const monthKeys = [...new Set(sys.orders.map(o => (o.date || '').slice(0, 7)).filter(Boolean))].sort().slice(-5);
      return monthKeys.map(key => {
        const monthOrders = sys.orders.filter(o => (o.date || '').slice(0,  7) === key && o.orderStatus !== 'Cancelled');
        const [year, month] = key.split('-').map(Number);
        const labelDate = new Date(year, month - 1, 1);
        return {
          label: labelDate.toLocaleString(lang === 'bn' ? 'bn-BD' : 'en-US', { month: 'short' }),
          fullLabel: labelDate.toLocaleString(lang === 'bn' ? 'bn-BD' : 'en-US', { month: 'long', year: 'numeric' }),
          revenue: monthOrders.reduce((s, o) => s + o.total, 0),
          orders: monthOrders.length
        };
      });
    }
  }, [sys.orders, chartGranularity, lang]);

  // Top Selling Products (computed from valid orders)
  const topProducts = useMemo(() => {
    const map = {};
    sys.orders.filter(o => o.orderStatus !== 'Cancelled').forEach(o => {
      o.items.forEach(item => {
        if (!map[item.productId]) map[item.productId] = { units: 0, revenue: 0 };
        map[item.productId].units += item.qty;
        map[item.productId].revenue += item.qty * item.price;
      });
    });
    return sys.products
      .map(p => ({ ...p, soldUnits: map[p.id]?.units || 0, soldRevenue: map[p.id]?.revenue || 0 }))
      .sort((a, b) => b.soldRevenue - a.soldRevenue)
      .slice(0, 5);
  }, [sys.orders, sys.products]);

  // Low Stock & Out-of-Stock Products
  const lowStockProducts = sys.products.filter(p => p.stock <= p.minStock).sort((a, b) => a.stock - b.stock);

  // Payment Method Revenue Breakdown
  const paymentBreakdown = useMemo(() => {
    const valid = sys.orders.filter(o => o.orderStatus !== 'Cancelled');
    const grand = valid.reduce((s, o) => s + o.total, 0) || 1;
    return ['COD', 'bKash', 'Nagad'].map(method => {
      const rev = valid.filter(o => o.paymentMethod === method).reduce((s, o) => s + o.total, 0);
      return { method, revenue: rev, pct: Math.round((rev / grand) * 100) };
    });
  }, [sys.orders]);

  // Category Breakdown
  const categoryBreakdown = useMemo(() => {
    const map = {};
    sys.orders.filter(o => o.orderStatus !== 'Cancelled').forEach(o => {
      o.items.forEach(item => {
        const prod = sys.products.find(p => p.id === item.productId);
        const catName = prod ? (lang === 'bn' ? prod.category_bn : prod.category_en) : 'Other';
        map[catName] = (map[catName] || 0) + item.qty * item.price;
      });
    });
    const entries = Object.entries(map).sort((a, b) => b[1] - a[1]);
    const maxVal = entries[0]?.[1] || 1;
    return entries.map(([name, revenue]) => ({ name, revenue, pct: Math.round((revenue / maxVal) * 100) }));
  }, [sys.orders, sys.products, lang]);

  const banglaTodayDisplay = new Date().toLocaleDateString('bn-BD', {
    timeZone: 'Asia/Dhaka', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  return (
    <div className="space-y-6">
      {/* Welcome Banner & Date Range Selector */}
      <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col xl:flex-row xl:items-center justify-between gap-4">
        <div>
          <div className="flex flex-wrap items-center gap-2">
            <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">{t.welcomeTitle}</h1>
            <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
              {banglaTodayDisplay}
            </span>
          </div>
          <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">{t.welcomeSub}</p>
        </div>

        <div className="flex flex-wrap items-center gap-2">
          <div className="flex flex-wrap bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold">
            {[
              ['today', t.rangeToday],
              ['yesterday', t.rangeYesterday],
              ['7d', t.range7d],
              ['30d', t.range30d],
              ['custom', t.rangeCustom]
            ].map(([id, label]) => (
              <button key={id} onClick={() => setDateRange(id)}
                className={`px-3 py-1.5 rounded-lg transition ${dateRange === id ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}`}>
                {label}
              </button>
            ))}
          </div>

          {dateRange === 'custom' && (
            <div className="flex items-center gap-1.5 text-xs">
              <input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-lg px-2 py-1.5" />
              <span>→</span>
              <input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-lg px-2 py-1.5" />
            </div>
          )}
        </div>
      </div>

      {/* 4 PROMINENT KPI CARDS */}
      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        {/* Card 1: Sales */}
        <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-bold text-slate-500 dark:text-slate-400">{t.kpiSales}</span>
            <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400">
              <Icons.TrendingUp size={18} />
            </div>
          </div>
          <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">{formatBDT(totalSales)}</div>
          <div className="mt-2 flex items-center justify-between text-[11px]">
            <span className={`font-bold px-2 py-0.5 rounded-full ${salesGrowth >= 0 ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-red-100 text-red-700'}`}>
              {salesGrowth === null ? (lang === 'bn' ? 'নতুন' : 'New') : salesGrowth >= 0 ? `↑ +${salesGrowth}%` : `↓ ${salesGrowth}%`}
            </span>
            <span className="text-slate-500">
              {lang === 'bn' ? `পরিশোধিত: ${formatBDT(paidRevenue)}` : `Paid: ${formatBDT(paidRevenue)}`}
            </span>
          </div>
          <div className="mt-1.5 text-[11px] text-amber-700 dark:text-amber-400 font-semibold">
            {lang === 'bn' ? `বকেয়া/যাচাই বাকি: ${formatBDT(pendingPaymentRev)}` : `Pending Payment: ${formatBDT(pendingPaymentRev)}`}
          </div>
        </div>

        {/* Card 2: Total Orders */}
        <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-bold text-slate-500 dark:text-slate-400">{t.kpiOrders}</span>
            <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-400">
              <Icons.ShoppingBag size={18} />
            </div>
          </div>
          <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">{filteredOrders.length}</div>
          <div className="mt-2 flex items-center justify-between text-[11px]">
            <span className={`font-bold px-2 py-0.5 rounded-full ${orderGrowth >= 0 ? 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300' : 'bg-red-100 text-red-700'}`}>
              {orderGrowth === null ? (lang === 'bn' ? 'নতুন' : 'New') : orderGrowth >= 0 ? `↑ +${orderGrowth}%` : `↓ ${orderGrowth}%`}
            </span>
            <span className="text-slate-500">
              {lang === 'bn' ? `কার্যকর: ${validOrders.length}টি` : `Valid: ${validOrders.length}`}
            </span>
          </div>
          <div className="mt-1.5 text-[11px] text-slate-500">
            {lang === 'bn' ? `পূর্ববর্তী সময়কালে: ${prevPeriodOrders.length}টি অর্ডার` : `Prev period: ${prevPeriodOrders.length} orders`}
          </div>
        </div>

        {/* Card 3: New Customers */}
        <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-bold text-slate-500 dark:text-slate-400">{t.kpiCustomers}</span>
            <div className="p-2.5 rounded-xl bg-purple-50 dark:bg-purple-950/60 text-purple-700 dark:text-purple-400">
              <Icons.Users size={18} />
            </div>
          </div>
          <div className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">{newCustomersCount}</div>
          <div className="mt-2 flex items-center justify-between text-[11px]">
            <span className="font-bold px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300">
              ↑ +14%
            </span>
            <span className="text-slate-500">
              {lang === 'bn' ? `মোট খামারি: ${sys.customers.length} জন` : `Total Farmers: ${sys.customers.length}`}
            </span>
          </div>
          <div className="mt-1.5 text-[11px] text-slate-500">
            {lang === 'bn' ? 'সারা বাংলাদেশের নিবন্ধিত ক্রেতা' : 'Registered livestock farmers'}
          </div>
        </div>

        {/* Card 4: Pending Orders (Urgent Highlight) */}
        <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border-2 border-amber-300 dark:border-amber-700/70 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-bold text-amber-800 dark:text-amber-300">{t.kpiPending}</span>
            <div className="p-2.5 rounded-xl bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-400">
              <Icons.AlertTriangle size={18} />
            </div>
          </div>
          <div className="text-2xl sm:text-3xl font-extrabold text-amber-700 dark:text-amber-400">{allPendingOrders.length}</div>
          <div className="mt-2 flex items-center justify-between text-[11px]">
            <span className="font-bold text-amber-800 dark:text-amber-300">
              {lang === 'bn' ? `${unverifiedOrders.length}টি পেমেন্ট যাচাই বাকি` : `${unverifiedOrders.length} unverified payments`}
            </span>
            <button onClick={() => onNavigate('orders')} className="font-extrabold text-emerald-700 dark:text-emerald-400 hover:underline">
              {lang === 'bn' ? 'প্রসেস করুন →' : 'Process →'}
            </button>
          </div>
          <div className="mt-1.5 text-[11px] text-slate-500">
            {lang === 'bn' ? 'কনফার্মেশনের অপেক্ষায় থাকা অর্ডার' : 'Awaiting admin confirmation'}
          </div>
        </div>
      </div>

      {/* SALES CHART + LOW STOCK ALERTS */}

        <div className="xl:col-span-2 bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div>
              <h3 className="font-extrabold text-base text-slate-900 dark:text-white">{t.chartTitle}</h3>
              <p className="text-xs text-slate-500">
                {lang === 'bn' ? 'BDT (৳) আয় এবং অর্ডার সংখ্যার তুলনামূলক চিত্র (হোভার করুন)' : 'Hover nodes to inspect BDT revenue & order volume'}
              </p>
            </div>
            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold">
              {[['daily', t.daily], ['weekly', t.weekly], ['monthly', t.monthly]].map(([g, lbl]) => (
                <button key={g} onClick={() => setChartGranularity(g)}

          <div>
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                <Icons.AlertTriangle size={18} className="text-red-600" />
                {t.lowStockAlerts}
              </h3>
              <span className="text-xs font-extrabold px-2 py-0.5 rounded-full bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300">
                {lowStockProducts.length}
              </span>
            </div>

            {lowStockProducts.length === 0 ? (
              <div className="py-8 text-center text-xs text-emerald-700 font-bold">
                {lang === 'bn' ? 'সকল পণ্যের পর্যাপ্ত স্টক রয়েছে!' : 'All products are well stocked!'}
              </div>
            ) : (
              <div className="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                {lowStockProducts.map(p => (
                  <div key={p.id} className={`p-3 rounded-xl border flex items-center justify-between gap-2 ${
                    p.stock === 0
                      ? 'bg-red-50/80 dark:bg-red-950/30 border-red-200 dark:border-red-800'
                      : 'bg-amber-50/70 dark:bg-amber-950/30 border-amber-200 dark:border-amber-800'
                  }`}>
                    <div className="min-w-0">

                        {lang === 'bn' ? p.name_bn : p.name_en}

// ============================================================================
// 12. MODULE 2: ORDER MANAGEMENT (Filters, Bulk Update, Details, Timeline)
// ============================================================================
const OrdersManagementPage = ({ sys, lang, t, onOpenOrder, onPrintInvoice, onUpdateStatus, onOpenManualOrder }) => {
  const [statusTab, setStatusTab] = useState('ALL');
  const [search, setSearch] = useState('');
  const [paymentFilter, setPaymentFilter] = useState('ALL');
  const [dateFilter, setDateFilter] = useState('');
  const [sortBy, setSortBy] = useState('newest');
  const [selectedIds, setSelectedIds] = useState([]);
  const [bulkStatus, setBulkStatus] = useState('Confirmed');
  const [page, setPage] = useState(1);
  const perPage = 10;

  const statuses = ['ALL', 'Pending', 'Confirmed', 'Processing', 'Shipped', 'Delivered', 'Cancelled', 'Returned'];

  const filtered = useMemo(() => {
    return sys.orders
      .filter(o => {
        if (statusTab !== 'ALL' && o.orderStatus !== statusTab) return false;
        if (paymentFilter !== 'ALL' && o.paymentMethod !== paymentFilter) return false;
        if (dateFilter && o.date !== dateFilter) return false;
        const q = search.trim().toLowerCase();
        if (q && !(o.id.toLowerCase().includes(q) || o.customerName.toLowerCase().includes(q) || o.phone.includes(q))) return false;
        return true;
      })
      .sort((a, b) => {
        const dateTime = (o) => `${o.date || ''} ${o.time || ''} ${o.createdAt || ''}`;
        if (sortBy === 'newest') return dateTime(b).localeCompare(dateTime(a)) || b.id.localeCompare(a.id);
        if (sortBy === 'oldest') return dateTime(a).localeCompare(dateTime(b)) || a.id.localeCompare(b.id);
        if (sortBy === 'highest') return b.total - a.total;
        if (sortBy === 'lowest') return a.total - b.total;
        return 0;
      });
  }, [sys.orders, statusTab, paymentFilter, dateFilter, search, sortBy]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
  const paginated = filtered.slice((page - 1) * perPage, page * perPage);

  const toggleSelect = (id) => {
    setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };

  const handleBulkApply = () => {
    selectedIds.forEach(id => onUpdateStatus(id, bulkStatus));
    setSelectedIds([]);
  };

  const handleExport = () => {
    exportToCSV(
      `dana-vet-orders-${getDhakaDateStr(0)}.csv`,
      ['Order ID', 'Date', 'Customer Name', 'Phone', 'Area', 'Address', 'Total (BDT)', 'Payment Method', 'TrxID', 'Payment Status', 'Order Status'],
      filtered.map(o => [o.id, o.date, o.customerName, o.phone, o.deliveryArea, o.address, o.total, o.paymentMethod, o.trxId, o.paymentStatus, o.orderStatus])
    );
  };

  return (
    <div className="space-y-5">
      {/* Top Action Bar */}
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex flex-wrap gap-1.5">
          {statuses.map(st => {
            const count = st === 'ALL' ? sys.orders.length : sys.orders.filter(o => o.orderStatus === st).length;
            return (
              <button key={st} onClick={() => { setStatusTab(st); setPage(1); }}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                  statusTab === st
                    ? 'bg-emerald-700 text-white shadow-sm'
                    : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                }`}>
                <span>{st === 'ALL' ? (lang === 'bn' ? 'সকল অর্ডার' : 'All Orders') : (lang === 'bn' ? ORDER_STATUS_CONFIG[st].bn : st)}</span>
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${statusTab === st ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>{count}</span>
              </button>
            );
          })}
        </div>

        <div className="flex items-center gap-2">
          <button onClick={handleExport} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 hover:bg-slate-50">
            <Icons.Download size={15} /> {t.exportCsv}
          </button>
          <button onClick={onOpenManualOrder} className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5">
            <Icons.Plus size={15} /> {t.qaNewOrder}
          </button>
        </div>
      </div>

      {/* Filter & Search Bar */}
      <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 text-xs">
        <div className="lg:col-span-2 relative">
          <input type="text" value={search} onChange={e => { setSearch(e.target.value); setPage(1); }}
            placeholder={lang === 'bn' ? 'অর্ডার আইডি (DANA-...), গ্রাহকের নাম বা মোবাইল...' : 'Search Order ID, Customer Name, Phone...'}
            className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl pl-9 pr-3 py-2" />
          <Icons.Search size={15} className="text-slate-400 absolute left-3 top-2.5" />
        </div>

        <select value={paymentFilter} onChange={e => { setPaymentFilter(e.target.value); setPage(1); }}
          className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-semibold">
          <option value="ALL">{lang === 'bn' ? 'সকল পেমেন্ট মাধ্যম' : 'All Payment Methods'}</option>
          <option value="COD">COD</option>
          <option value="bKash">bKash</option>
          <option value="Nagad">Nagad</option>
        </select>

        <input type="date" value={dateFilter} onChange={e => { setDateFilter(e.target.value); setPage(1); }}
          className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-semibold" />

        <select value={sortBy} onChange={e => setSortBy(e.target.value)}
          className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-semibold">
          <option value="newest">{lang === 'bn' ? 'নতুন অর্ডার আগে' : 'Sort: Newest'}</option>
          <option value="oldest">{lang === 'bn' ? 'পুরাতন অর্ডার আগে' : 'Sort: Oldest'}</option>
          <option value="highest">{lang === 'bn' ? 'সর্বোচ্চ মূল্য' : 'Sort: Highest Amount'}</option>
          <option value="lowest">{lang === 'bn' ? 'সর্বনিম্ন মূল্য' : 'Sort: Lowest Amount'}</option>
        </select>
      </div>

      {/* Bulk Action Bar */}
      {selectedIds.length > 0 && (
        <div className="bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 p-3 rounded-xl flex flex-wrap items-center justify-between gap-3 text-xs">
          <span className="font-bold text-emerald-900 dark:text-emerald-200">
            {selectedIds.length} {lang === 'bn' ? 'টি অর্ডার নির্বাচিত হয়েছে' : 'orders selected'}
          </span>
          <div className="flex items-center gap-2">
            <select value={bulkStatus} onChange={e => setBulkStatus(e.target.value)}
              className="border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-900 rounded-lg px-2.5 py-1.5 font-bold">
              {Object.keys(ORDER_STATUS_CONFIG).map(st => <option key={st} value={st}>{st}</option>)}
            </select>
            <button onClick={handleBulkApply} className="bg-emerald-700 text-white font-bold px-3.5 py-1.5 rounded-lg">
              {lang === 'bn' ? 'বাল্ক আপডেট করুন' : 'Update Selected'}
            </button>
          </div>
        </div>
      )}

      {/* Orders Table */}
      <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs text-left">
            <thead className="bg-slate-50 dark:bg-slate-800/70 text-slate-500 uppercase text-[11px] font-bold">
              <tr>
                <th className="py-3 px-4 w-8">
                  <input type="checkbox"
                    checked={paginated.length > 0 && paginated.every(o => selectedIds.includes(o.id))}
                    onChange={e => setSelectedIds(e.target.checked ? paginated.map(o => o.id) : [])} />
                </th>
                <th className="py-3 px-4">{t.orderId}</th>
                <th className="py-3 px-4">{t.customer}</th>
                <th className="py-3 px-4">{t.date}</th>
                <th className="py-3 px-4">{t.products}</th>
                <th className="py-3 px-4">{t.total}</th>
                <th className="py-3 px-4">{t.payment}</th>
                <th className="py-3 px-4">{t.status}</th>
                <th className="py-3 px-4 text-right">{t.action}</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
              {paginated.length === 0 ? (
                <tr><td colSpan="9" className="py-10 text-center text-slate-400">{lang === 'bn' ? 'কোনো অর্ডার পাওয়া যায়নি' : 'No orders match your filters'}</td></tr>
              ) : paginated.map(order => (
                <tr key={order.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                  <td className="py-3 px-4">
                    <input type="checkbox" checked={selectedIds.includes(order.id)} onChange={() => toggleSelect(order.id)} />
                  </td>
                  <td className="py-3 px-4 font-extrabold text-emerald-700 dark:text-emerald-400 whitespace-nowrap">
                    <button onClick={() => onOpenOrder(order)} className="hover:underline">{order.id}</button>
                    <span className="block text-[10px] font-normal text-slate-400">{order.source}</span>
                  </td>
                  <td className="py-3 px-4">
                    <p className="font-bold text-slate-900 dark:text-white">{order.customerName}</p>
                    <p className="text-[11px] text-slate-500">{order.phone}</p>
                  </td>
                  <td className="py-3 px-4 whitespace-nowrap text-slate-600 dark:text-slate-400">
                    {order.date}
                    <span className="block text-[10px] text-slate-400">{order.time}</span>
                  </td>
                  <td className="py-3 px-4 max-w-[200px] truncate">
                    {order.items.map(i => `${lang === 'bn' ? i.name_bn : i.name_en} (×${i.qty})`).join(', ')}
                  </td>
                  <td className="py-3 px-4 font-extrabold whitespace-nowrap">{formatBDT(order.total)}</td>
                  <td className="py-3 px-4 whitespace-nowrap">
                    <span className="font-bold">{order.paymentMethod}</span>
                    <span className={`block w-fit mt-0.5 text-[10px] px-1.5 rounded font-bold ${PAYMENT_STATUS_CONFIG[order.paymentStatus]?.badge}`}>
                      {order.paymentStatus}
                    </span>
                  </td>
                  <td className="py-3 px-4 whitespace-nowrap">
                    <span className={`inline-block text-[11px] font-bold px-2.5 py-1 rounded-lg border ${ORDER_STATUS_CONFIG[order.orderStatus]?.badge}`}>
                      {lang === 'bn' ? ORDER_STATUS_CONFIG[order.orderStatus]?.bn : order.orderStatus}
                    </span>
                  </td>
                  <td className="py-3 px-4 whitespace-nowrap text-right space-x-1">
                    <button onClick={() => onOpenOrder(order)} className="px-2.5 py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-bold hover:bg-emerald-100">
                      {lang === 'bn' ? 'বিস্তারিত' : 'Details'}
                    </button>
                    <button onClick={() => onPrintInvoice(order)} className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      <Icons.Printer size={14} />
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Pagination */}
        <div className="px-4 py-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">
          <span className="text-slate-500">
            {lang === 'bn' ? `মোট ${filtered.length}টি অর্ডারের মধ্যে ${(page - 1) * perPage + 1}–${Math.min(page * perPage, filtered.length)} দেখাচ্ছে` : `Showing ${(page - 1) * perPage + 1}–${Math.min(page * perPage, filtered.length)} of ${filtered.length}`}
          </span>
          <div className="flex items-center gap-1">
            <button disabled={page <= 1} onClick={() => setPage(p => p - 1)} className="px-3 py-1 rounded-lg border border-slate-300 dark:border-slate-700 disabled:opacity-40 font-bold">
              {lang === 'bn' ? 'পূর্ববর্তী' : 'Prev'}
            </button>
            <span className="px-2 font-bold">{page} / {totalPages}</span>
            <button disabled={page >= totalPages} onClick={() => setPage(p => p + 1)} className="px-3 py-1 rounded-lg border border-slate-300 dark:border-slate-700 disabled:opacity-40 font-bold">
              {lang === 'bn' ? 'পরবর্তী' : 'Next'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// 13. ORDER DETAILS MODAL (Visual Timeline, Cancel/Return Reason, TrxID Verify)
// ============================================================================
const OrderDetailsModal = ({ order, onClose, onUpdateStatus, onVerifyPayment, onPrintInvoice, lang, t }) => {
  const [reasonInput, setReasonInput] = useState(order.cancelReason || '');
  const [pendingActionStatus, setPendingActionStatus] = useState(null);

  const timelineSteps = ['Pending', 'Confirmed', 'Processing', 'Shipped', 'Delivered'];
  const currentStepIdx = timelineSteps.indexOf(order.orderStatus);

  const handleStatusChange = (nextSt) => {
    if (nextSt === 'Cancelled' || nextSt === 'Returned') {
      setPendingActionStatus(nextSt);
      return;
    }
    onUpdateStatus(order.id, nextSt);
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-white dark:bg-slate-900 rounded-2xl max-w-3xl w-full shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col max-h-[92vh]">
        {/* Header */}
        <div className="px-6 py-4 bg-emerald-800 text-white flex items-center justify-between">
          <div>
            <div className="flex items-center gap-2">
              <h3 className="font-extrabold text-lg">{order.id}</h3>
              <span className="text-xs bg-white/20 px-2.5 py-0.5 rounded-full font-bold">{order.source}</span>
            </div>
            <p className="text-xs text-emerald-200">{order.date} • {order.time} (Asia/Dhaka)</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => onPrintInvoice(order)} className="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5">
              <Icons.Printer size={15} /> {t.printInvoice}
            </button>
            <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/15"><Icons.X size={20} /></button>
          </div>
        </div>

        {/* Body */}
        <div className="p-6 overflow-y-auto space-y-6 text-xs">
          {/* Visual Order Timeline */}
          <div className="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
            <div className="flex items-center justify-between mb-3">
              <span className="font-extrabold text-slate-700 dark:text-slate-200">
                {lang === 'bn' ? 'অর্ডার প্রগ্রেস টাইমলাইন' : 'Order Fulfillment Timeline'}
              </span>
              <span className={`px-2.5 py-0.5 rounded-full font-bold border ${ORDER_STATUS_CONFIG[order.orderStatus]?.badge}`}>
                {lang === 'bn' ? ORDER_STATUS_CONFIG[order.orderStatus]?.bn : order.orderStatus}
              </span>
            </div>

            {['Cancelled', 'Returned'].includes(order.orderStatus) ? (
              <div className="p-3 rounded-xl bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-red-800 dark:text-red-300 font-bold">
                {order.orderStatus}: {order.cancelReason || 'No reason provided'}
              </div>
            ) : (
              <div className="grid grid-cols-5 gap-2">
                {timelineSteps.map((step, idx) => {
                  const done = idx <= currentStepIdx;
                  return (
                    <div key={step} className="text-center">
                      <div className={`h-2 rounded-full mb-1.5 ${done ? 'bg-emerald-600' : 'bg-slate-200 dark:bg-slate-700'}`} />
                      <span className={`text-[11px] font-bold ${done ? 'text-emerald-700 dark:text-emerald-400' : 'text-slate-400'}`}>
                        {lang === 'bn' ? ORDER_STATUS_CONFIG[step].bn : step}
                      </span>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Status Update Buttons */}
            <div className="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 flex flex-wrap items-center gap-2">
              <span className="font-bold text-slate-500 mr-1">{lang === 'bn' ? 'স্ট্যাটাস পরিবর্তন:' : 'Update Status:'}</span>
              {Object.keys(ORDER_STATUS_CONFIG).map(st => (
                <button key={st} onClick={() => handleStatusChange(st)}
                  className={`px-2.5 py-1 rounded-lg font-bold border transition ${
                    order.orderStatus === st
                      ? 'bg-emerald-700 text-white border-emerald-700'
                      : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 hover:border-emerald-600'
                  }`}>
                  {lang === 'bn' ? ORDER_STATUS_CONFIG[st].bn : st}
                </button>
              ))}
            </div>

            {/* Reason prompt for Cancel / Return */}
            {pendingActionStatus && (
              <div className="mt-3 p-3 bg-amber-50 dark:bg-amber-950/50 border border-amber-300 rounded-xl space-y-2">
                <p className="font-bold text-amber-900 dark:text-amber-300">
                  {lang === 'bn' ? `${pendingActionStatus} করার কারণ লিখুন (স্টক স্বয়ংক্রিয়ভাবে পুনরুদ্ধার হবে):` : `Enter reason for ${pendingActionStatus} (stock will be restored if deducted):`}
                </p>

                    placeholder={lang === 'bn' ? 'কারণ লিখুন...' : 'Reason...'}

          {/* Customer & Payment Information Grid */}

                {lang === 'bn' ? 'গ্রাহক ও ডেলিভারি তথ্য' : 'Customer & Shipping Info'}

              <p><strong>{lang === 'bn' ? 'মোবাইল:' : 'Phone:'}</strong> {order.phone}</p>
              <p><strong>{lang === 'bn' ? 'এলাকা:' : 'Delivery Area:'}</strong> {order.deliveryArea}</p>
              <p><strong>{lang === 'bn' ? 'ঠিকানা:' : 'Address:'}</strong> {order.address}</p>
              <p><strong>{lang === 'bn' ? 'ডেলিভারি স্ট্যাটাস:' : 'Delivery Status:'}</strong> {order.deliveryStatus || (order.orderStatus === 'Delivered' ? 'Delivered' : order.orderStatus === 'Shipped' ? 'Shipped' : 'Processing')}</p>
              {order.courierName && <p><strong>{lang === 'bn' ? 'কুরিয়ার:' : 'Courier:'}</strong> {order.courierName}</p>}
              {order.trackingId && <p><strong>Tracking ID:</strong> <span className="font-mono">{order.trackingId}</span></p>}
              {order.notes && <p className="text-amber-700 dark:text-amber-400"><strong>Notes:</strong> {order.notes}</p>}
