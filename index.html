  const [coupon, setCoupon] = useState('');
  const [discountPercent, setDiscountPercent] = useState(0);

  const [deliveryArea, setDeliveryArea] = useState('inside');
  const [paymentMethod, setPaymentMethod] = useState('cod');
  const [trxId, setTrxId] = useState('');

  const [customerInfo, setCustomerInfo] = useState({ name: '', phone: '', address: '', notes: '' });
  const [orders, setOrders] = useState([]);
  const [placedOrderId, setPlacedOrderId] = useState(null);

  const [trackIdInput, setTrackIdInput] = useState('');
  const [trackedOrder, setTrackedOrder] = useState(null);

  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  const t = TRANSLATIONS[lang];

  const filteredProducts = useMemo(() => {
    return PRODUCTS.filter(p => {
      const q = searchQuery.toLowerCase();
      return (
        p.name_bn.toLowerCase().includes(q) ||
        p.name_en.toLowerCase().includes(q) ||
        p.category_bn.toLowerCase().includes(q) ||
        p.category_en.toLowerCase().includes(q)
      );
    });
  }, [searchQuery]);

  const addToCart = (product, quantity = 1) => {
    setCart(prev => {
      const existing = prev.find(item => item.id === product.id);
      if (existing) {
        return prev.map(item =>
          item.id === product.id ? { ...item, qty: item.qty + quantity } : item
        );
      }
      return [...prev, { ...product, qty: quantity }];
    });
  };

  const updateCartQty = (id, delta) => {
    setCart(prev =>
      prev
        .map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        })
        .filter(Boolean)
    );
  };

  const removeFromCart = id => setCart(prev => prev.filter(item => item.id !== id));

  const totalCartItems = cart.reduce((acc, item) => acc + item.qty, 0);
  const subtotal = cart.reduce((acc, item) => acc + item.price * item.qty, 0);
  const deliveryFee = cart.length > 0 ? (deliveryArea === 'inside' ? 80 : 150) : 0;
  const discountAmount = Math.round((subtotal * discountPercent) / 100);
  const grandTotal = Math.max(0, subtotal + deliveryFee - discountAmount);

  const handleApplyCoupon = (e) => {
    e.preventDefault();
    const c = coupon.trim().toUpperCase();
    if (c === 'DAIRY10') {
      setDiscountPercent(10);
      alert(lang === 'bn' ? '১০% ডিসকাউন্ট যোগ করা হয়েছে!' : '10% discount applied!');
    } else if (c === 'VET50') {
      setDiscountPercent(15);
      alert(lang === 'bn' ? '১৫% ডিসকাউন্ট যোগ করা হয়েছে!' : '15% discount applied!');
    } else {
      alert(lang === 'bn' ? 'অকার্যকর কুপন কোড' : 'Invalid coupon code');
    }
  };

  const handlePlaceOrder = (e) => {
    e.preventDefault();
    if (cart.length === 0) {
      alert(lang === 'bn' ? 'আপনার কার্ট খালি!' : 'Your cart is empty!');
      return;
    }
    if (!customerInfo.name || !customerInfo.phone || !customerInfo.address) {
      alert(lang === 'bn' ? 'অনুগ্রহ করে সকল তথ্য সঠিক পূরণ করুন' : 'Please fill all customer fields');
      return;
    }
    if ((paymentMethod === 'bkash' || paymentMethod === 'nagad') && !trxId.trim()) {
      alert(lang === 'bn' ? 'অনুগ্রহ করে বিকাশের/নগদের TrxID দিন' : 'Please provide Transaction ID (TrxID)');
      return;
    }

    const newId = 'DANA-' + Math.floor(100000 + Math.random() * 900000);
    const newOrder = {
      id: newId,
      items: [...cart],
      customer: { ...customerInfo },
      paymentMethod: paymentMethod.toUpperCase(),
      trxId: paymentMethod !== 'cod' ? trxId : 'N/A',
      deliveryArea: deliveryArea === 'inside' ? 'Inside Dhaka' : 'Outside Dhaka',
      total: grandTotal,
      status: lang === 'bn' ? 'প্রসেসিং' : 'Processing',
      date: new Date().toLocaleDateString()
    };

    setOrders([newOrder, ...orders]);
    setPlacedOrderId(newId);
    setCart([]);
    setTrxId('');
    setIsCartOpen(false);
    setCustomerInfo({ name: '', phone: '', address: '', notes: '' });
  };

  const handleTrackOrder = (e) => {

            )}

            {trackedOrder && trackedOrder !== 'NOT_FOUND' && (
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-left">
                <p className="text-sm font-bold text-slate-800">{t.orderIdText} {trackedOrder.id}</p>
                <p className="text-xs text-slate-600 mt-1">{t.customerName}: {trackedOrder.customer.name}</p>
                <p className="text-xs text-slate-600">
                  {t.paymentMethod} {trackedOrder.paymentMethod} {trackedOrder.trxId !== 'N/A' && `(TrxID: ${trackedOrder.trxId})`}
                </p>
                <p className="text-xs text-emerald-800 font-bold mt-2">
                  {t.status}: <span className="bg-emerald-200 px-2 py-0.5 rounded">{trackedOrder.status}</span>
                </p>
                <p className="text-xs text-slate-500 mt-1">{t.grandTotal} ৳{trackedOrder.total}</p>
              </div>
            )}
          </div>
        )}
      </main>

      {/* CART DRAWER */}
      {isCartOpen && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex justify-end">
          <div className="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div className="p-4 bg-emerald-800 text-white flex items-center justify-between">
              <div className="flex items-center gap-2 font-bold text-lg">
                <ShoppingCart className="w-5 h-5" />
                {t.cartTitle} ({totalCartItems})
              </div>
              <button onClick={() => setIsCartOpen(false)} className="p-1 text-emerald-200 hover:text-white rounded-lg">
                <X className="w-6 h-6" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {cart.length === 0 ? (
                <div className="text-center py-12 text-slate-400">
                  <ShoppingCart className="w-12 h-12 mx-auto mb-2 text-slate-300" />
                  <p className="font-bold text-slate-600">{t.cartEmpty}</p>
                  <p className="text-xs text-slate-400 mt-1">{t.cartEmptySub}</p>
                </div>
              ) : (
                <>
                  {cart.map(item => {
                    const name = lang === 'en' ? item.name_en : item.name_bn;
                    return (
                      <div key={item.id} className="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <img src={item.image} alt={name} className="w-14 h-14 object-cover rounded-lg" />
                        <div className="flex-1">
                          <h5 className="font-bold text-slate-800 text-sm">{name}</h5>
                          <p className="text-xs text-emerald-700 font-extrabold">৳{item.price}</p>
                          <div className="flex items-center gap-2 mt-2">
                            <button onClick={() => updateCartQty(item.id, -1)} className="w-6 h-6 bg-slate-200 rounded flex items-center justify-center hover:bg-slate-300">
                              <Minus className="w-3 h-3" />
                            </button>
                            <span className="text-xs font-extrabold">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.id, 1)} className="w-6 h-6 bg-slate-200 rounded flex items-center justify-center hover:bg-slate-300">
                              <Plus className="w-3 h-3" />
                            </button>
                          </div>
                        </div>
                        <button onClick={() => removeFromCart(item.id)} className="text-red-500 hover:text-red-700 p-1">
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    );
                  })}

                  <form onSubmit={handleApplyCoupon} className="flex gap-2 pt-2">
                    <input
                      type="text"
                      value={coupon}
                      onChange={e => setCoupon(e.target.value)}
                      placeholder={t.couponPlaceholder}
                      className="flex-1 border border-slate-300 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                    <button type="submit" className="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl hover:bg-slate-900">
                      {t.applyCoupon}
                    </button>
                  </form>

                  <div className="border-t border-slate-200 pt-4 mt-4">
                    <h5 className="font-bold text-slate-800 text-sm mb-3">
                      {lang === 'bn' ? 'শিপিং ও ডেলিভারি তথ্য' : 'Shipping & Delivery Info'}
                    </h5>
                    <div className="space-y-2.5 text-xs">
                      <input
                        type="text"
                        placeholder={t.customerName}
                        value={customerInfo.name}
                        onChange={e => setCustomerInfo({ ...customerInfo, name: e.target.value })}
                        className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                      <input
                        type="text"
                        placeholder={t.customerPhone}
                        value={customerInfo.phone}
                        onChange={e => setCustomerInfo({ ...customerInfo, phone: e.target.value })}
                        className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                      <textarea
                        placeholder={t.address}
                        value={customerInfo.address}
                        onChange={e => setCustomerInfo({ ...customerInfo, address: e.target.value })}
                        rows={2}
                        className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />

                      <div>
                        <label className="font-bold text-slate-700 mb-1 flex items-center gap-1">
                          <MapPin className="w-3.5 h-3.5 text-emerald-600" />
                          {t.deliveryArea}
                        </label>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={() => setDeliveryArea('inside')}
                            className={`p-2 rounded-xl text-center border font-bold transition ${deliveryArea === 'inside' ? 'bg-emerald-50 border-emerald-600 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-600'}`}
                          >{t.insideDhaka}</button>
                          <button
                            type="button"
                            onClick={() => setDeliveryArea('outside')}
                            className={`p-2 rounded-xl text-center border font-bold transition ${deliveryArea === 'outside' ? 'bg-emerald-50 border-emerald-600 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-600'}`}
                          >{t.outsideDhaka}</button>
                        </div>
                      </div>

                      <div className="pt-2">
                        <label className="font-bold text-slate-700 mb-1 flex items-center gap-1">
                          <CreditCard className="w-3.5 h-3.5 text-emerald-600" />
                          {t.paymentMethod}
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                          <button
                            type="button"
                            onClick={() => setPaymentMethod('cod')}
                            className={`p-2 rounded-xl text-[11px] font-bold border transition ${paymentMethod === 'cod' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-100 text-slate-700 border-slate-200'}`}
                          >{t.cod}</button>
                          <button
                            type="button"
                            onClick={() => setPaymentMethod('bkash')}
                            className={`p-2 rounded-xl text-[11px] font-bold border transition ${paymentMethod === 'bkash' ? 'bg-pink-600 text-white border-pink-600' : 'bg-slate-100 text-slate-700 border-slate-200'}`}
                          >{t.bkash}</button>
                          <button
                            type="button"
                            onClick={() => setPaymentMethod('nagad')}
                            className={`p-2 rounded-xl text-[11px] font-bold border transition ${paymentMethod === 'nagad' ? 'bg-orange-600 text-white border-orange-600' : 'bg-slate-100 text-slate-700 border-slate-200'}`}
                          >{t.nagad}</button>
                        </div>

                        {(paymentMethod === 'bkash' || paymentMethod === 'nagad') && (
                          <div className="mt-2.5 p-2.5 bg-amber-50 border border-amber-200 rounded-xl space-y-2">
                            <p className="text-[11px] text-amber-900 font-semibold leading-tight">{t.paymentInstruction}</p>
                            <input
                              type="text"
                              placeholder={t.trxIdPlaceholder}
                              value={trxId}
                              onChange={e => setTrxId(e.target.value)}
                              className="w-full border border-amber-300 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white"
                            />
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>

            {cart.length > 0 && (
              <div className="p-4 bg-slate-50 border-t border-slate-200 space-y-2">
                <div className="flex justify-between text-xs text-slate-600"><span>{t.totalAmount}</span><span>৳{subtotal}</span></div>
                <div className="flex justify-between text-xs text-slate-600"><span>{t.deliveryFee}</span><span>৳{deliveryFee}</span></div>
                {discountAmount > 0 && (
                  <div className="flex justify-between text-xs text-emerald-700 font-bold"><span>{t.discount}</span><span>-৳{discountAmount}</span></div>
                )}
                <div className="flex justify-between text-base font-extrabold text-slate-900 border-t border-slate-200 pt-2">
                  <span>{t.grandTotal}</span>
                  <span className="text-emerald-700">৳{grandTotal}</span>
                </div>
                <button
                  onClick={handlePlaceOrder}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow-lg transition mt-2 flex items-center justify-center gap-2 text-sm"
                >
                  <CheckCircle className="w-4 h-4" />
                  {t.checkoutBtn}
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* FOOTER */}
      <footer className="bg-[#0f172a] text-slate-200 pt-12 pb-8 border-t border-slate-800 mt-12">
        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 pb-10 border-b border-slate-800">
          <div>
            <div className="flex items-center gap-2 mb-3">
              <div className="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center font-black text-white text-lg">D</div>
              <h3 className="text-xl font-black text-white tracking-tight">
                Dana Vet BD <span className="text-emerald-400">(ডানা ভেট বিডি)</span>
              </h3>
            </div>
            <p className="text-xs text-slate-400 leading-relaxed">
              Your trusted digital partner for cattle feeds, veterinary medicines, vaccines, and expert farm guidance across Bangladesh.
            </p>
          </div>

          <div>
            <h4 className="font-extrabold text-white text-sm tracking-wider uppercase mb-4 flex items-center gap-2">
              <PhoneCall className="w-4 h-4 text-emerald-400" />
              {t.helplineTitle}
            </h4>
            <ul className="space-y-2.5 text-xs text-slate-300">
              <li className="flex items-center gap-2">
                <span className="text-slate-400 font-medium">{t.hotlineLabel}</span>
                <a href="tel:09612345678" className="font-bold text-emerald-400 hover:underline">09612-345678</a>
                <span className="text-[10px] text-slate-500">(9 AM - 8 PM)</span>
              </li>
              <li className="flex items-center gap-2">
                <span className="text-slate-400 font-medium">{t.whatsappLabel}</span>
                <a href="https://wa.me/8801712345678" target="_blank" rel="noreferrer" className="font-bold text-emerald-400 hover:underline">01712-345678</a>
              </li>
              <li className="flex items-center gap-2">
                <span className="text-slate-400 font-medium">{t.vetLabel}</span>
                <a href="tel:01812345678" className="font-bold text-amber-400 hover:underline">01812-345678</a>
              </li>
            </ul>
          </div>

          <div>
            <h4 className="font-extrabold text-white text-sm tracking-wider uppercase mb-3 flex items-center gap-2">
              <MessageCircle className="w-4 h-4 text-emerald-400" />
              {t.communityTitle}
            </h4>
            <p className="text-xs text-slate-400 mb-4 leading-relaxed">{t.communityDesc}</p>
            <div className="flex flex-col sm:flex-row gap-2.5">
              <a href="https://facebook.com" target="_blank" rel="noreferrer" className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow">
                <Globe className="w-4 h-4" />
                {t.joinFB}
              </a>
              <a href="https://whatsapp.com" target="_blank" rel="noreferrer" className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow">
                <MessageCircle className="w-4 h-4" />
                {t.joinWA}
              </a>
            </div>
          </div>
        </div>

        <div className="max-w-7xl mx-auto px-4 pt-6 text-center text-[11px] text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
          <p>© 2026 Dana Vet BD (ডানা ভেট বিডি). All rights reserved.</p>
          <p className="flex items-center gap-3">
            <span onClick={() => setActiveTab('policy')} className="hover:text-slate-400 cursor-pointer">{t.navPolicy}</span>
          </p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
