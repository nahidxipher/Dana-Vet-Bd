            <div className="p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
              <h4 className="font-extrabold text-sm text-slate-900 dark:text-white mb-2">
                {lang === 'bn' ? 'পেমেন্ট ও ভেরিফিকেশন' : 'Payment & Verification'}
              </h4>
              <p><strong>{lang === 'bn' ? 'মাধ্যম:' : 'Method:'}</strong> {order.paymentMethod}</p>
              <p>
                <strong>{lang === 'bn' ? 'স্ট্যাটাস:' : 'Status:'}</strong>{' '}
                <span className={`px-2 py-0.5 rounded font-bold ${PAYMENT_STATUS_CONFIG[order.paymentStatus]?.badge}`}>
                  {order.paymentStatus}
                </span>
              </p>

              {(order.paymentMethod === 'bKash' || order.paymentMethod === 'Nagad') && (
                <div className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                  <p><strong>Transaction ID (TrxID):</strong> <span className="font-mono font-extrabold text-emerald-700 dark:text-emerald-400">{order.trxId}</span></p>
                  {order.paymentStatus !== 'Verified' ? (
                    <button onClick={() => onVerifyPayment(order.id, 'Verified')}
                      className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-1.5 rounded-lg flex items-center justify-center gap-1.5">
                      <Icons.CheckCircle size={14} />
                      {lang === 'bn' ? 'ট্রানজেকশন ভেরিফাই করুন' : 'Verify Transaction ID'}
                    </button>
                  ) : (
                    <p className="text-emerald-700 dark:text-emerald-400 font-bold flex items-center gap-1">
                      <Icons.CheckCircle size={14} /> {lang === 'bn' ? 'স্টাফ কর্তৃক ভেরিফায়েড' : 'Verified by Authorized Staff'}
                    </p>
                  )}
                </div>
              )}

              {order.paymentMethod === 'COD' && (
                <div className="pt-1">
                  {order.paymentStatus !== 'Paid' ? (

};

// ============================================================================
// 14. MODULE 3: PRODUCT MANAGEMENT (Full CRUD, Duplicate, Syncs to Storefront)
// ============================================================================
const ProductsManagementPage = ({ sys, setSys, lang, t, currentUser, logAudit, notifyToast, setConfirmDialog, onOpenProductForm }) => {
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('ALL');
  const [stockFilter, setStockFilter] = useState('ALL');
  const [sortBy, setSortBy] = useState('default');
  const [selectedIds, setSelectedIds] = useState([]);

  const filtered = useMemo(() => {
    return sys.products
      .filter(p => {
        if (catFilter !== 'ALL' && p.categoryId !== catFilter) return false;
        if (stockFilter === 'low' && !(p.stock > 0 && p.stock <= p.minStock)) return false;
        if (stockFilter === 'out' && p.stock > 0) return false;
        if (stockFilter === 'in' && p.stock <= p.minStock) return false;
        const q = search.trim().toLowerCase();
        if (q && !(p.name_bn.toLowerCase().includes(q) || p.name_en.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q))) return false;
        return true;
      })
      .sort((a, b) => {
        if (sortBy === 'price_asc') return a.price - b.price;
        if (sortBy === 'price_desc') return b.price - a.price;
        if (sortBy === 'stock_asc') return a.stock - b.stock;
        return 0;
      });
  }, [sys.products, search, catFilter, stockFilter, sortBy]);

  const handleDuplicate = (prod) => {
    setSys(prev => {
      const nextId = Math.max(0, ...prev.products.map(p => p.id)) + 1;
      const copy = {
        ...prod,
        id: nextId,
        sku: prod.sku + '-COPY',
        name_bn: prod.name_bn + ' (কপি)',
        name_en: prod.name_en + ' (Copy)'
      };
      return {
        ...prev,
        products: [copy, ...prev.products],
        auditLogs: logAudit(prev, 'Product Duplicated', copy.sku)
      };
    });
    notifyToast(lang === 'bn' ? 'পণ্য ডুপ্লিকেট করা হয়েছে!' : 'Product duplicated!');
  };

  const handleDelete = (prod) => {
    setConfirmDialog({
      title: lang === 'bn' ? 'পণ্য মুছে ফেলবেন?' : 'Delete Product?',
      message: `${lang === 'bn' ? prod.name_bn : prod.name_en} (${prod.sku}) স্থায়ীভাবে মুছে যাবে।`,
      onConfirm: () => {
        setSys(prev => ({
          ...prev,
          products: prev.products.filter(p => p.id !== prod.id),
          auditLogs: logAudit(prev, 'Product Deleted', prod.sku)
        }));
        setConfirmDialog(null);
        notifyToast(lang === 'bn' ? 'পণ্য মুছে ফেলা হয়েছে' : 'Product deleted');
      }
    });
  };

  const toggleStatus = (id) => {
    setSys(prev => ({
      ...prev,
      products: prev.products.map(p => p.id === id ? { ...p, status: p.status === 'active' ? 'inactive' : 'active' } : p)
    }));
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h3 className="font-extrabold text-base text-slate-900 dark:text-white">
            {lang === 'bn' ? `সকল পণ্য (${sys.products.length}টি)` : `Product Catalog (${sys.products.length} Items)`}
          </h3>
          <p className="text-xs text-slate-500">
            {lang === 'bn' ? 'এখান থেকে কোনো পণ্য পরিবর্তন করলে লাইভ স্টোরফ্রন্টে স্বয়ংক্রিয়ভাবে আপডেট হবে' : 'All changes sync live with the customer-facing Dana Vet BD Storefront'}
          </p>
        </div>
        <button onClick={() => onOpenProductForm({ mode: 'add', product: null })}
          className="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center gap-1.5 shadow-sm">
          <Icons.Plus size={16} /> {t.qaAddProduct}
        </button>
      </div>

      {/* Filters */}
      <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
        <div className="relative">
          <input type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder={lang === 'bn' ? 'পণ্যের নাম বা SKU খুঁজুন...' : 'Search product name or SKU...'}
            className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl pl-9 pr-3 py-2" />
          <Icons.Search size={15} className="text-slate-400 absolute left-3 top-2.5" />
        </div>

        <select value={catFilter} onChange={e => setCatFilter(e.target.value)}
          className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-semibold">
          <option value="ALL">{lang === 'bn' ? 'সকল ক্যাটাগরি' : 'All Categories'}</option>
          {sys.categories.map(c => <option key={c.id} value={c.id}>{lang === 'bn' ? c.name_bn : c.name_en}</option>)}
        </select>

        <select value={stockFilter} onChange={e => setStockFilter(e.target.value)}
          className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-semibold">
          <option value="ALL">{lang === 'bn' ? 'সকল স্টক অবস্থা' : 'All Stock Levels'}</option>
          <option value="in">{lang === 'bn' ? 'পর্যাপ্ত স্টক (In Stock)' : 'In Stock'}</option>
          <option value="low">{lang === 'bn' ? 'লো স্টক (Low Stock)' : 'Low Stock'}</option>
          <option value="out">{lang === 'bn' ? 'স্টক শেষ (Out of Stock)' : 'Out of Stock'}</option>
        </select>

        <select value={sortBy} onChange={e => setSortBy(e.target.value)}
          className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-semibold">
          <option value="default">{lang === 'bn' ? 'ডিফল্ট ক্রম' : 'Sort: Default'}</option>
          <option value="price_asc">{lang === 'bn' ? 'দাম: কম থেকে বেশি' : 'Price: Low to High'}</option>
          <option value="price_desc">{lang === 'bn' ? 'দাম: বেশি থেকে কম' : 'Price: High to Low'}</option>
          <option value="stock_asc">{lang === 'bn' ? 'স্টক: কম থেকে বেশি' : 'Stock: Low to High'}</option>
        </select>
      </div>

      {/* Bulk Activate / Deactivate */}
      {selectedIds.length > 0 && (
        <div className="bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 p-3 rounded-xl flex items-center justify-between text-xs">
          <span className="font-bold">{selectedIds.length} products selected</span>
          <div className="flex gap-2">
            <button onClick={() => {
              setSys(p => ({ ...p, products: p.products.map(x => selectedIds.includes(x.id) ? { ...x, status: 'active' } : x) }));
              setSelectedIds([]);
              notifyToast('Selected products activated');
            }} className="bg-emerald-700 text-white font-bold px-3 py-1 rounded-lg">Activate</button>
            <button onClick={() => {
              setSys(p => ({ ...p, products: p.products.map(x => selectedIds.includes(x.id) ? { ...x, status: 'inactive' } : x) }));
              setSelectedIds([]);
              notifyToast('Selected products deactivated');
            }} className="bg-slate-700 text-white font-bold px-3 py-1 rounded-lg">Deactivate</button>
          </div>
        </div>
      )}

      {/* Products Table */}
      <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs text-left">
            <thead className="bg-slate-50 dark:bg-slate-800/70 text-slate-500 uppercase text-[11px] font-bold">
              <tr>
                <th className="py-3 px-4 w-8">
                  <input type="checkbox"
                    checked={filtered.length > 0 && filtered.every(p => selectedIds.includes(p.id))}
                    onChange={e => setSelectedIds(e.target.checked ? filtered.map(p => p.id) : [])} />
                </th>
                <th className="py-3 px-4">{lang === 'bn' ? 'পণ্য' : 'Product'}</th>
                <th className="py-3 px-4">SKU</th>

const CategoriesManagementPage = ({ sys, setSys, lang, t, logAudit, notifyToast, setConfirmDialog }) => {
  const [nameBn, setNameBn] = useState('');
  const [nameEn, setNameEn] = useState('');

  const handleAdd = (e) => {
    e.preventDefault();
    if (!nameBn.trim() || !nameEn.trim()) return;
    setSys(prev => {
      const newCat = {
        id: 'cat-' + Date.now().toString().slice(-4),
        name_bn: nameBn.trim(),
        name_en: nameEn.trim(),
        slug: nameEn.trim().toLowerCase().replace(/\s+/g, '-'),
        status: 'active'
      };
      return {
        ...prev,
        categories: [...prev.categories, newCat],
        auditLogs: logAudit(prev, 'Category Created', newCat.name_en)
      };
    });
    setNameBn('');
    setNameEn('');
    notifyToast(lang === 'bn' ? 'নতুন ক্যাটাগরি যোগ হয়েছে!' : 'Category added!');
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <form onSubmit={handleAdd} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3 h-fit text-xs">
        <h3 className="font-extrabold text-base">{lang === 'bn' ? 'নতুন ক্যাটাগরি যোগ করুন' : 'Add New Category'}</h3>
        <div>
          <label className="block font-bold mb-1">ক্যাটাগরি নাম (বাংলা) *</label>
          <input required type="text" value={nameBn} onChange={e => setNameBn(e.target.value)}
            placeholder="যেমন: ডেইরি ইকুইপমেন্ট" className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
        </div>
        <div>
          <label className="block font-bold mb-1">Category Name (English) *</label>
          <input required type="text" value={nameEn} onChange={e => setNameEn(e.target.value)}
            placeholder="e.g. Dairy Equipment" className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
        </div>
        <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-xl">
          + {lang === 'bn' ? 'ক্যাটাগরি সংরক্ষণ করুন' : 'Save Category'}
        </button>
      </form>

      <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
        <table className="w-full text-xs text-left">
          <thead className="bg-slate-50 dark:bg-slate-800/70 text-slate-500 uppercase text-[11px] font-bold">
            <tr>
              <th className="py-3 px-4">{lang === 'bn' ? 'বাংলা নাম' : 'Bangla Name'}</th>
              <th className="py-3 px-4">{lang === 'bn' ? 'ইংরেজি নাম' : 'English Name'}</th>
              <th className="py-3 px-4">{lang === 'bn' ? 'পণ্য সংখ্যা' : 'Products'}</th>
              <th className="py-3 px-4">{lang === 'bn' ? 'স্ট্যাটাস' : 'Status'}</th>
              <th className="py-3 px-4 text-right">{t.action}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
            {sys.categories.map(cat => {
              const prodCount = sys.products.filter(p => p.categoryId === cat.id).length;
              return (
                <tr key={cat.id}>
                  <td className="py-3 px-4 font-bold">{cat.name_bn}</td>
                  <td className="py-3 px-4">{cat.name_en}</td>
                  <td className="py-3 px-4 font-extrabold text-emerald-700 dark:text-emerald-400">{prodCount}</td>
                  <td className="py-3 px-4">
                    <button onClick={() => setSys(p => ({ ...p, categories: p.categories.map(c => c.id === cat.id ? { ...c, status: c.status === 'active' ? 'inactive' : 'active' } : c) }))}
                      className={`px-2.5 py-0.5 rounded-full font-bold text-[11px] ${cat.status === 'active' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                      {cat.status}
                    </button>
                  </td>
                  <td className="py-3 px-4 text-right">
                    <button onClick={() => setConfirmDialog({
                      title: 'Delete Category?',
                      message: `Delete ${cat.name_en}?`,
                      onConfirm: () => {
                        setSys(p => ({ ...p, categories: p.categories.filter(c => c.id !== cat.id) }));

                    })} className="p-1.5 text-red-600 hover:bg-red-50 rounded-lg">
                      <Icons.Trash size={14} />
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );

// 20. MODULE 7: SALES & FINANCIAL MANAGEMENT (Revenue vs Profit Separation)

const SalesRevenuePage = ({ sys, lang, t }) => {
  const [period, setPeriod] = useState('30d');

  const orders = useMemo(() => {
    const today = getDhakaDateStr(0);
    return sys.orders.filter(o => {
      if (period === 'today') return o.date === today;
      if (period === '7d') return o.date >= getDhakaDateStr(-6);
      if (period === '30d') return o.date >= getDhakaDateStr(-29);
      return true;
    });
  }, [sys.orders, period]);

  const nonCancelled = orders.filter(o => o.orderStatus !== 'Cancelled');
  const grossSales = nonCancelled.reduce((s, o) => s + o.subtotal, 0);
  const totalDiscounts = nonCancelled.reduce((s, o) => s + (o.discount || 0), 0);
  const deliveryCharges = nonCancelled.reduce((s, o) => s + (o.deliveryFee || 0), 0);
  const refunds = orders.filter(o => o.paymentStatus === 'Refunded' || o.orderStatus === 'Returned').reduce((s, o) => s + o.total, 0);
  const netSales = grossSales - totalDiscounts - refunds;

  const paidRevenue = nonCancelled.filter(o => ['Paid', 'Verified'].includes(o.paymentStatus)).reduce((s, o) => s + o.total, 0);
  const unpaidRevenue = nonCancelled.filter(o => ['Unpaid', 'Pending Verification'].includes(o.paymentStatus)).reduce((s, o) => s + o.total, 0);

  const codRev = nonCancelled.filter(o => o.paymentMethod === 'COD').reduce((s, o) => s + o.total, 0);
  const bkashRev = nonCancelled.filter(o => o.paymentMethod === 'bKash').reduce((s, o) => s + o.total, 0);
  const nagadRev = nonCancelled.filter(o => o.paymentMethod === 'Nagad').reduce((s, o) => s + o.total, 0);

  // Calculated Gross Product Margin ONLY from items with recorded purchase costPrice
  let recordedCostTotal = 0;
  let revenueWithCost = 0;
  nonCancelled.filter(o => o.orderStatus !== 'Returned').forEach(o => {
    o.items.forEach(item => {
      const prod = sys.products.find(p => p.id === item.productId);
      const unitCost = item.costPrice || prod?.costPrice || 0;
      if (unitCost > 0) {
        recordedCostTotal += unitCost * item.qty;
        revenueWithCost += item.price * item.qty;
      }
    });
  });
  const calculatedProductMargin = revenueWithCost - recordedCostTotal - totalDiscounts;

  const handleExport = () => {
    exportToCSV(
      `dana-vet-financials-${period}-${getDhakaDateStr(0)}.csv`,
      ['Metric', 'Amount (BDT)'],
      [
        ['Gross Product Sales', grossSales],
        ['Total Discounts', totalDiscounts],
        ['Delivery Charges Collected', deliveryCharges],
        ['Refunds / Returns', refunds],
        ['Net Product Sales', netSales],
        ['Paid / Verified Revenue', paidRevenue],
        ['Unpaid / Pending Revenue', unpaidRevenue],
        ['COD Total', codRev],
        ['bKash Total', bkashRev],
        ['Nagad Total', nagadRev],
        ['Calculated Product Margin (Based on Recorded Cost Price)', calculatedProductMargin]
      ]
    );
  };

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex bg-white dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-bold">

const DeliveryManagementPage = ({ sys, setSys, lang, notifyToast, logAudit, onUpdateOrderStatus }) => {

  const statuses = ['Processing','Shipped','In Transit','Delivered','Failed'];
  const statusOf = o => o.deliveryStatus || (o.orderStatus==='Delivered'?'Delivered':o.orderStatus==='Shipped'?'Shipped':'Processing');
  const visible = sys.orders.filter(o=>!['Cancelled','Returned'].includes(o.orderStatus)).filter(o=>{const q=query.trim().toLowerCase();const matches=!q||[o.id,o.customerName,o.phone,o.trackingId||'',o.courierName||''].some(x=>String(x).toLowerCase().includes(q));return matches&&(filter==='ALL'||statusOf(o)===filter);});
  const save=(id,patch,quiet=false)=>{setSys(prev=>({...prev,orders:prev.orders.map(o=>o.id===id?{...o,...patch}:o),auditLogs:quiet?prev.auditLogs:logAudit(prev,'Delivery Updated',id)}));if(!quiet)notifyToast(lang==='bn'?'ডেলিভারি তথ্য আপডেট হয়েছে':'Delivery information updated');};
  const badge=s=>s==='Delivered'?'bg-emerald-100 text-emerald-800':s==='Failed'?'bg-red-100 text-red-800':s==='In Transit'?'bg-blue-100 text-blue-800':s==='Shipped'?'bg-indigo-100 text-indigo-800':'bg-amber-100 text-amber-800';
  return <div className="space-y-4"><div className="grid grid-cols-2 md:grid-cols-5 gap-3">{statuses.map(st=><div key={st} className="bg-white dark:bg-slate-900 border rounded-xl p-3"><p className="text-xs text-slate-500 font-bold">{st}</p><p className="text-xl font-extrabold">{sys.orders.filter(o=>statusOf(o)===st).length}</p></div>)}</div>
    <div className="bg-white dark:bg-slate-900 border rounded-2xl overflow-hidden"><div className="p-4 flex flex-col md:flex-row gap-3 border-b"><input value={query} onChange={e=>setQuery(e.target.value)} placeholder={lang==='bn'?'অর্ডার, গ্রাহক, ফোন বা Tracking খুঁজুন':'Search order, customer, phone or tracking'} className="flex-1 border rounded-xl px-3 py-2 bg-transparent"/><select value={filter} onChange={e=>setFilter(e.target.value)} className="border rounded-xl px-3 py-2 bg-transparent"><option value="ALL">All Status</option>{statuses.map(st=><option key={st}>{st}</option>)}</select></div><div className="overflow-x-auto"><table className="w-full text-xs text-left"><thead className="bg-slate-50 dark:bg-slate-800"><tr><th className="p-3">Order / Customer</th><th className="p-3">Status</th><th className="p-3">Courier</th><th className="p-3">Tracking ID</th><th className="p-3">Address</th></tr></thead><tbody className="divide-y">{visible.map(o=><tr key={o.id}><td className="p-3 min-w-[170px]"><b>{o.id}</b><div>{o.customerName}</div><div className="text-slate-500">{o.phone}</div></td><td className="p-3 min-w-[150px]"><select value={statusOf(o)} onChange={e=>{const next=e.target.value;if(['Shipped','Delivered'].includes(next))onUpdateOrderStatus(o.id,next);else save(o.id,{deliveryStatus:next});}} className={`px-2 py-1.5 rounded-lg font-bold ${badge(statusOf(o))}`}><option>Processing</option><option>Shipped</option><option>In Transit</option><option>Delivered</option><option>Failed</option></select></td><td className="p-3 min-w-[150px]"><input value={o.courierName||''} onChange={e=>save(o.id,{courierName:e.target.value},true)} onBlur={e=>save(o.id,{courierName:e.target.value})} placeholder="Courier" className="w-full border rounded-lg px-2 py-1.5 bg-transparent"/></td><td className="p-3 min-w-[160px]"><input value={o.trackingId||''} onChange={e=>save(o.id,{trackingId:e.target.value},true)} onBlur={e=>save(o.id,{trackingId:e.target.value})} placeholder="Tracking ID" className="w-full border rounded-lg px-2 py-1.5 bg-transparent"/></td><td className="p-3 min-w-[220px] text-slate-500">{o.address||'—'}</td></tr>)}</tbody></table>{!visible.length&&<div className="p-8 text-center text-slate-500">No matching deliveries.</div>}</div></div></div>;

  const completedSales = reportOrders.filter(o => o.orderStatus === 'Delivered');
  const reports = [
    { id: 'daily_sales', title: lang === 'bn' ? 'দৈনিক বিক্রয় রিপোর্ট' : 'Daily Sales Report' },
    { id: 'monthly_sales', title: lang === 'bn' ? 'মাসিক বিক্রয় রিপোর্ট' : 'Monthly Sales Report' },
    { id: 'orders', title: lang === 'bn' ? 'অর্ডার রিপোর্ট' : 'Order Status Report' },
    { id: 'product_sales', title: lang === 'bn' ? 'পণ্য বিক্রয় রিপোর্ট' : 'Product Sales Report' },
    { id: 'best_sellers', title: lang === 'bn' ? 'সেরা বিক্রিত পণ্য' : 'Best-Selling Products' },
    { id: 'low_stock', title: lang === 'bn' ? 'লো-স্টক রিপোর্ট' : 'Low Stock Report' },
    { id: 'products', title: lang === 'bn' ? 'পণ্য তালিকা রিপোর্ট' : 'Product Catalog Report' },
    { id: 'inventory', title: lang === 'bn' ? 'ইনভেন্টরি ভ্যালু রিপোর্ট' : 'Inventory Valuation Report' },
    { id: 'customers', title: lang === 'bn' ? 'গ্রাহক ক্রয় সারাংশ' : 'Customer Purchase Summary' },
    { id: 'payments', title: lang === 'bn' ? 'পেমেন্ট রিপোর্ট' : 'Payment Collection Report' }
  ];
  const downloadActiveReport = () => {
    const today = getDhakaDateStr(0);
    if (selectedReport === 'inventory') {
      exportToCSV(`inventory-report-${today}.csv`, ['SKU','Product','Stock','Min Stock','Cost Price','Selling Price','Stock Value'], sys.products.map(p => [p.sku,p.name_en,p.stock,p.minStock,p.costPrice,p.price,p.stock*p.costPrice]));
    } else if (selectedReport === 'products') {
      exportToCSV(`product-catalog-${today}.csv`, ['SKU','Product','Category','Price','Stock','Status'], sys.products.map(p => [p.sku,p.name_en,p.category_en,p.price,p.stock,p.status]));

    } else if (selectedReport === 'product_sales' || selectedReport === 'best_sellers') {
      const rows = sys.products.map(p => {
        const sold = completedSales.flatMap(o => (o.items || []).filter(i => i.productId === p.id).map(i => ({ qty: Number(i.qty || 0), revenue: Number(i.qty || 0) * Number(i.price || 0) })));
        return [p.sku,p.name_en,sold.reduce((sum,i) => sum+i.qty,0),sold.reduce((sum,i) => sum+i.revenue,0)];
      }).filter(row => row[2] > 0).sort((a,b) => b[2]-a[2]);
      exportToCSV(`${selectedReport}-${today}.csv`, ['SKU','Product','Units Sold','Sales Revenue'], rows);
    } else if (selectedReport === 'daily_sales') {
      const grouped = {};
      completedSales.forEach(o => { const day = o.date || 'Unknown'; if (!grouped[day]) grouped[day] = { count: 0, revenue: 0 }; grouped[day].count++; grouped[day].revenue += Number(o.total || 0); });
      exportToCSV(`daily-sales-${today}.csv`, ['Date','Completed Orders','Sales Revenue'], Object.entries(grouped).sort((a,b) => a[0].localeCompare(b[0])).map(([day,v]) => [day,v.count,v.revenue]));
    } else if (selectedReport === 'monthly_sales') {
      const grouped = {};
      completedSales.forEach(o => { const month = String(o.date || '').slice(0,7) || 'Unknown'; if (!grouped[month]) grouped[month] = { count: 0, revenue: 0 }; grouped[month].count++; grouped[month].revenue += Number(o.total || 0); });
      exportToCSV(`monthly-sales-${today}.csv`, ['Month','Completed Orders','Sales Revenue'], Object.entries(grouped).sort((a,b) => a[0].localeCompare(b[0])).map(([month,v]) => [month,v.count,v.revenue]));
    } else if (selectedReport === 'customers') {
      exportToCSV(`customer-purchase-summary-${today}.csv`, ['Customer ID','Customer','Phone','Completed Orders','Purchase Total'], sys.customers.map(c => { const orders = completedSales.filter(o => o.customerId === c.id || (o.phone && o.phone === c.phone)); return [c.id,c.name,c.phone,orders.length,orders.reduce((sum,o) => sum+Number(o.total || 0),0)]; }));
    } else if (selectedReport === 'payments') {
      exportToCSV(`payment-report-${today}.csv`, ['Order ID','Date','Customer','Total','Payment Method','Payment Status'], reportOrders.map(o => [o.id,o.date,o.customerName,o.total,o.paymentMethod,o.paymentStatus]));
    } else {
      exportToCSV(`order-status-report-${today}.csv`, ['Order ID','Date','Customer','Phone','Total','Payment','Payment Status','Order Status'], reportOrders.map(o => [o.id,o.date,o.customerName,o.phone,o.total,o.paymentMethod,o.paymentStatus,o.orderStatus]));
    }
  };
  return (
    <div className="space-y-6">
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {reports.map(r => <button key={r.id} onClick={() => setSelectedReport(r.id)} className={`p-4 rounded-2xl border text-left transition flex items-center justify-between ${selectedReport === r.id ? 'bg-emerald-700 text-white border-emerald-700 shadow-md' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-emerald-500'}`}><div><p className="font-extrabold text-sm">{r.title}</p><p className={`text-[11px] mt-0.5 ${selectedReport === r.id ? 'text-emerald-100' : 'text-slate-400'}`}>CSV Export</p></div><Icons.FileText size={20}/></button>)}
      </div>
      <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 space-y-4">
        <div className="flex flex-wrap items-center justify-between gap-3"><h3 className="font-extrabold text-base">{reports.find(r => r.id === selectedReport)?.title}</h3><div className="flex gap-2"><button onClick={() => window.print()} className="border border-slate-300 dark:border-slate-700 text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5"><Icons.Printer size={14}/>Print / PDF</button><button onClick={downloadActiveReport} className="bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5"><Icons.Download size={14}/>{t.exportCsv}</button></div></div>
        <div className="flex flex-wrap items-end gap-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3"><div><label className="block text-[11px] font-bold mb-1">From</label><input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="border rounded-lg px-2 py-1.5 bg-white dark:bg-slate-900"/></div><div><label className="block text-[11px] font-bold mb-1">To</label><input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="border rounded-lg px-2 py-1.5 bg-white dark:bg-slate-900"/></div><button onClick={() => {setDateFrom('');setDateTo('');}} className="text-xs font-bold px-3 py-2 rounded-lg border">Clear</button><span className="text-xs text-slate-500">{lang === 'bn' ? `ফিল্টার করা অর্ডার: ${reportOrders.length}` : `Filtered orders: ${reportOrders.length}`}</span></div>
        <div id="printable-area" className="overflow-x-auto"><table className="w-full text-xs text-left"><thead className="bg-slate-50 dark:bg-slate-800 font-bold"><tr><th className="py-2.5 px-3">{t.orderId}</th><th className="py-2.5 px-3">{t.date}</th><th className="py-2.5 px-3">{t.customer}</th><th className="py-2.5 px-3">{t.payment}</th><th className="py-2.5 px-3">{t.status}</th><th className="py-2.5 px-3 text-right">{t.total}</th></tr></thead><tbody className="divide-y divide-slate-200 dark:divide-slate-800">{reportOrders.slice(0,15).map(o=><tr key={o.id}><td className="py-2.5 px-3 font-bold">{o.id}</td><td className="py-2.5 px-3">{o.date}</td><td className="py-2.5 px-3">{o.customerName}</td><td className="py-2.5 px-3">{o.paymentMethod} ({o.paymentStatus})</td><td className="py-2.5 px-3">{o.orderStatus}</td><td className="py-2.5 px-3 text-right font-extrabold">{formatBDT(o.total)}</td></tr>)}</tbody></table></div>
      </div>
    </div>
  );
};

                <td className="py-3 px-4">
                  <select value={s.role} onChange={e => {
                    const newRole = e.target.value;
                    setSys(p => ({ ...p, staff: p.staff.map(x => x.id === s.id ? { ...x, role: newRole } : x) }));
                    notifyToast(`Updated ${s.name} role to ${newRole}`);
                  }} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-lg px-2 py-1 font-bold">
                    {Object.keys(ROLES).map(r => <option key={r} value={r}>{r}</option>)}

                <td className="py-3 px-4">
                  <button disabled={s.id === currentUser.id}

          }}
            className={`p-3.5 rounded-xl border cursor-pointer flex items-start justify-between gap-3 ${
              n.unread ? 'bg-emerald-50/70 dark:bg-emerald-950/30 border-emerald-200 dark:border-emerald-800' : 'border-slate-200 dark:border-slate-800'

// 28. MANUAL ORDER & ADD CUSTOMER MODALS

const ManualOrderModal = ({ sys, onClose, onCreate, lang }) => {
  const [customerName, setCustomerName] = useState('');
  const [phone, setPhone] = useState('');
  const [address, setAddress] = useState('');
  const [deliveryArea, setDeliveryArea] = useState('Inside Dhaka');
  const [paymentMethod, setPaymentMethod] = useState('COD');
  const [trxId, setTrxId] = useState('');
  const [selectedProdId, setSelectedProdId] = useState(sys.products[0]?.id || 1);
  const [qty, setQty] = useState(1);

  const selectedProd = sys.products.find(p => p.id === Number(selectedProdId)) || sys.products[0];
  const subtotal = (selectedProd?.price || 0) * Number(qty);
  const deliveryFee = deliveryArea === 'Inside Dhaka' ? 80 : 150;
  const total = subtotal + deliveryFee;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!customerName || !phone || !address || !selectedProd) return;
    onCreate({
      customerName,
      phone,
      address,
      deliveryArea,
      items: [{
        productId: selectedProd.id,
        name_bn: selectedProd.name_bn,
        name_en: selectedProd.name_en,
        qty: Number(qty),
        price: selectedProd.price,
        costPrice: selectedProd.costPrice
      }],
      subtotal,
      deliveryFee,
      discount: 0,
      couponCode: '',
      total,
      paymentMethod,
      trxId: paymentMethod === 'COD' ? 'N/A' : trxId
    });
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
        <div className="px-6 py-4 bg-emerald-800 text-white flex justify-between items-center">
          <h3 className="font-extrabold text-base">{lang === 'bn' ? 'নতুন ম্যানুয়াল অর্ডার তৈরি' : 'Create Manual Phone Order'}</h3>
          <button onClick={onClose}><Icons.X size={20} /></button>
        </div>
        <form onSubmit={handleSubmit} className="p-6 space-y-3 text-xs">
          <div className="grid grid-cols-2 gap-3">
            <input required placeholder="Customer Name *" value={customerName} onChange={e => setCustomerName(e.target.value)} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
            <input required placeholder="Phone Number *" value={phone} onChange={e => setPhone(e.target.value)} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
          </div>
          <input required placeholder="Full Delivery Address *" value={address} onChange={e => setAddress(e.target.value)} className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
          <div className="grid grid-cols-3 gap-2">
            <select value={selectedProdId} onChange={e => setSelectedProdId(e.target.value)} className="col-span-2 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-bold">
              {sys.products.map(p => <option key={p.id} value={p.id}>{p.name_bn} — ৳{p.price} (Stock: {p.stock})</option>)}
            </select>
            <input type="number" min="1" value={qty} onChange={e => setQty(e.target.value)} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2 font-bold" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <select value={deliveryArea} onChange={e => setDeliveryArea(e.target.value)} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2">
              <option value="Inside Dhaka">Inside Dhaka (৳80)</option>
              <option value="Outside Dhaka">Outside Dhaka (৳150)</option>
            </select>
            <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)} className="border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2">
              <option value="COD">COD</option>
              <option value="bKash">bKash</option>
              <option value="Nagad">Nagad</option>
            </select>
          </div>
          {paymentMethod !== 'COD' && (
            <input required placeholder="Transaction ID (TrxID) *" value={trxId} onChange={e => setTrxId(e.target.value)} className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
          )}
          <div className="p-3 bg-emerald-50 dark:bg-emerald-950/50 rounded-xl flex justify-between font-extrabold text-sm">
            <span>Grand Total:</span>
            <span className="text-emerald-700 dark:text-emerald-400">{formatBDT(total)}</span>
          </div>
          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border font-bold">Cancel</button>
            <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-700 text-white font-bold">Create Order</button>
          </div>
        </form>
      </div>
    </div>
  );
};

          <input required placeholder="Phone Number *" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
          <select value={form.area} onChange={e => setForm({ ...form, area: e.target.value })} className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2">
            <option value="Inside Dhaka">Inside Dhaka</option>

          <input placeholder="Farm Notes (Optional)" value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} className="w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl px-3 py-2" />
          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border font-bold">Cancel</button>
            <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-700 text-white font-bold">Save Customer</button>
          </div>
        </form>
      </div>
    </div>
  );
};
